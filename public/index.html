<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#fff5e9" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Casa · tareas en familia</title>
<meta name="description" content="Organiza las tareas del hogar en familia: tareas fijas y adicionales, paga, niveles y menús semanales." />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" type="image/png" sizes="192x192" href="/iconos/icono-192.png" />
<!-- iOS ("Añadir a pantalla de inicio"). Los iconos deben ser OPACOS y sin
     esquinas redondeadas: iOS aplica su propia máscara, y si el PNG tiene
     transparencia la compone sobre negro o descarta el icono. Se declaran
     varios tamaños porque iOS elige el que mejor encaje en cada dispositivo. -->
<link rel="apple-touch-icon" sizes="180x180" href="/iconos/apple-touch-icon.png" />
<link rel="apple-touch-icon" sizes="167x167" href="/iconos/apple-touch-icon-167.png" />
<link rel="apple-touch-icon" sizes="152x152" href="/iconos/apple-touch-icon-152.png" />
<link rel="apple-touch-icon" sizes="120x120" href="/iconos/apple-touch-icon-120.png" />
<link rel="apple-touch-icon-precomposed" href="/iconos/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-title" content="Casa" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
<style>
:root{
  /* ----- Paleta cálida "hogar soleado" ----- */
  --bg:#fef6ea;          /* crema papel */
  --bg2:#f5ead8;         /* crema más cálido (inputs, tracks) */
  --card:#ffffff;        /* tarjetas blancas */
  --card2:#fdf3e6;       /* relleno suave */
  --line:#efe1cc;        /* líneas cálidas */
  --text:#43352a;        /* marrón cálido oscuro */
  --dim:#9c8a76;         /* texto secundario */
  --faint:#c3b4a0;       /* texto muy tenue */

  --accent:#ff7a59;      /* coral alegre (acción principal) */
  --accent-ink:#ffffff;  /* texto sobre coral */
  --sun:#ffc24b;         /* amarillo sol */
  --green:#2fae73;       /* verde menta/hoja */
  --amber:#f59331;       /* mandarina */
  --red:#ef5b5b;         /* rojo suave */
  --cyan:#2f9fd0;        /* azul cielo */
  --violet:#8b6fd6;      /* uva */

  --shadow:0 8px 22px rgba(180,120,70,.10), 0 2px 6px rgba(180,120,70,.06);
  --shadow-lg:0 14px 40px rgba(180,120,70,.16);
  --r:20px;
  --num:"Fredoka",ui-rounded,system-ui,sans-serif;
  font-family:"Nunito",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);min-height:100vh}
body{
  background-image:
    radial-gradient(520px 320px at 88% -6%, rgba(255,194,75,.22), transparent 60%),
    radial-gradient(460px 300px at -8% 4%, rgba(255,122,89,.14), transparent 60%),
    radial-gradient(600px 400px at 50% 108%, rgba(47,159,208,.10), transparent 60%);
  background-attachment:fixed;
}
h1,h2,h3{margin:0;font-family:var(--num);font-weight:600;letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;font-size:15px;background:var(--bg2);border:1.5px solid var(--line);color:var(--text);border-radius:12px;padding:11px 13px;width:100%;font-weight:600}
input:focus,select:focus{outline:none;border-color:var(--accent);background:#fff}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;font-weight:600}
.dim{color:var(--dim)} .faint{color:var(--faint)}
.screen{animation:rise .4s cubic-bezier(.2,.8,.2,1)}
/* Repintado por sincronización de fondo: nada se vuelve a animar, para que la
   pantalla no parezca refrescarse sola cada pocos segundos. */
.screen.quiet,.screen.quiet *{animation:none!important}
/* Contador de pendientes en las pestañas: es el "aviso" de la app, ya que no
   hay notificaciones push. */
.badge-num{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 5px;
  border-radius:999px;background:var(--red);color:#fff;font-size:11px;font-weight:800;
  font-family:var(--num);margin-left:auto;flex:none;line-height:1}
.nav .badge-num{position:absolute;top:2px;right:50%;transform:translateX(22px);margin:0}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.8);opacity:0}60%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}

.pill{font-size:11px;padding:5px 11px;border-radius:999px;font-weight:700;display:inline-flex;align-items:center;gap:5px}
.p-pending{background:#f0e7d8;color:#9c8a76}
.p-wait{background:#fff0d6;color:var(--amber)}
.p-ok{background:#d9f5e7;color:var(--green)}
.p-late{background:#fde0e0;color:var(--red)}
.p-fixed{background:#d9eefa;color:var(--cyan)}
.p-extra{background:#eae6fb;color:var(--violet)}
.pts{font-family:var(--num);font-weight:700;color:var(--accent)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 17px;border-radius:14px;font-weight:800;font-size:14px;background:#fff;border:1.5px solid var(--line);color:var(--text);transition:transform .12s, box-shadow .15s}
.btn:hover{box-shadow:var(--shadow)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 6px 16px rgba(255,122,89,.32)}
.btn.primary:hover{box-shadow:0 8px 22px rgba(255,122,89,.42)}
.btn.sm{padding:8px 13px;font-size:13px;border-radius:11px}
.btn.ok{background:#d9f5e7;color:var(--green);border-color:#bfead4}
.btn.ghost{background:transparent;box-shadow:none}
.btn:active{transform:scale(.96)} .btn:disabled{opacity:.45;cursor:default;box-shadow:none}
.btn.w{width:100%}

.card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card.glow{background:linear-gradient(160deg,#ffffff,#fff4e2);border-color:#ffe3bb}
.row{display:flex;align-items:center;gap:10px} .spacer{flex:1}
.field{margin-bottom:13px} .field label{font-size:12px;color:var(--dim);display:block;margin-bottom:6px;font-weight:700}
.sect-title{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;font-weight:800;margin:4px 0 10px}
.empty{text-align:center;color:var(--faint);padding:32px 10px;font-size:14px;font-weight:600}
.preview-tag{display:inline-block;font-size:10px;font-weight:800;color:var(--violet);background:#eae6fb;padding:3px 9px;border-radius:7px;margin-left:8px}
.avatar{border-radius:14px;display:grid;place-items:center;font-weight:800;flex:none;font-family:var(--num)}
.progress{height:11px;background:var(--bg2);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.progress>span{display:block;height:100%;border-radius:999px;transition:width .6s cubic-bezier(.2,.8,.2,1)}

/* ===== Barra de modo (demo) ===== */
.modebar{position:fixed;top:0;left:0;right:0;z-index:50;background:rgba(254,246,234,.86);backdrop-filter:blur(12px);border-bottom:1.5px solid var(--line);display:flex;align-items:center;gap:10px;padding:9px 16px;font-size:13px;font-weight:700}
.modebar .seg{display:flex;background:var(--bg2);border:1.5px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.modebar .seg button{padding:6px 13px;border-radius:9px;font-size:12px;color:var(--dim);font-weight:800}
.modebar .seg button.on{background:var(--accent);color:#fff;box-shadow:0 3px 8px rgba(255,122,89,.3)}

/* =========================================================
   ESCRITORIO (padre)
   ========================================================= */
.desk{display:none}
.desk .wrap{max-width:1240px;margin:0 auto;padding:64px 26px 48px;display:grid;grid-template-columns:230px 1fr;gap:26px}
.side{position:sticky;top:64px;align-self:start}
.side .brand{display:flex;align-items:center;gap:11px;margin-bottom:24px;padding:0 4px}
.side .brand .dot{width:46px;height:46px;border-radius:15px;background:linear-gradient(150deg,var(--accent),var(--sun));display:grid;place-items:center;font-size:22px;box-shadow:0 8px 18px rgba(255,122,89,.3);transform:rotate(-4deg)}
.side nav{display:flex;flex-direction:column;gap:5px}
.side nav button{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;color:var(--dim);font-weight:800;font-size:14px;text-align:left;width:100%;transition:.15s}
.side nav button.on{background:#fff;color:var(--text);box-shadow:var(--shadow);border:1.5px solid var(--line)}
.side nav button.on svg{stroke:var(--accent)}
.side nav button:hover:not(.on){color:var(--text);background:rgba(255,255,255,.5)}
.side nav svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.deskmain h2{font-size:27px;margin-bottom:3px}
.deskmain .crumb{color:var(--dim);font-size:14px;margin-bottom:24px;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:22px}
.kpi{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:17px;box-shadow:var(--shadow);border-top:4px solid var(--accent);animation:rise .4s both}
.kpi:nth-child(1){border-top-color:var(--green)} .kpi:nth-child(2){border-top-color:var(--cyan)}
.kpi:nth-child(3){border-top-color:var(--sun)} .kpi:nth-child(4){border-top-color:var(--violet)}
.kpi:nth-child(2){animation-delay:.05s} .kpi:nth-child(3){animation-delay:.1s} .kpi:nth-child(4){animation-delay:.15s}
.kpi .k{font-size:13px;color:var(--dim);font-weight:700} .kpi .v{font-family:var(--num);font-size:28px;margin-top:6px;font-weight:700} .kpi .v small{font-size:15px;color:var(--dim)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.cols-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);font-weight:800;padding:9px 10px;border-bottom:2px solid var(--line)}
td{padding:12px 10px;border-bottom:1px solid var(--line);font-size:14px;font-weight:600}
tr:last-child td{border-bottom:none}
.bal{display:flex;gap:18px;align-items:flex-end;height:155px;padding-top:10px}
.bal .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:9px;height:100%;justify-content:flex-end}
.bal .bar{width:100%;max-width:56px;border-radius:14px 14px 7px 7px;display:flex;align-items:flex-start;justify-content:center;padding-top:7px;transition:height .6s cubic-bezier(.2,.8,.2,1);box-shadow:inset 0 -6px 12px rgba(0,0,0,.06)}
.bal .bar .v{font-family:var(--num);font-size:13px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.18)}
.bal .nm{font-size:13px;color:var(--dim);font-weight:700}
.task-line{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.task-line:last-child{border:none}
.tic{width:42px;height:42px;border-radius:13px;background:var(--card2);display:grid;place-items:center;font-size:19px;flex:none;border:1.5px solid var(--line)}
.chip{font-size:11px;padding:4px 10px;border-radius:9px;background:var(--card2);border:1.5px solid var(--line);color:var(--dim);font-weight:700}

/* =========================================================
   MÓVIL (hijo)
   ========================================================= */
.mob{display:none}
.mob .phone{max-width:480px;margin:0 auto;padding:58px 16px 100px;position:relative;min-height:100vh}
.mob .head{display:flex;align-items:center;gap:13px;margin-bottom:18px}
.mob .head .avatar{width:48px;height:48px;font-size:20px;box-shadow:var(--shadow)}
.mob .head h1{font-size:20px} .mob .head .sub{font-size:12px;color:var(--dim);margin-top:2px;font-weight:700}
.mob .icon-btn{margin-left:auto;width:44px;height:44px;border-radius:14px;background:#fff;border:1.5px solid var(--line);display:grid;place-items:center;box-shadow:var(--shadow)}
.hero{background:linear-gradient(150deg,#fff,#fff0df 60%,#ffe7ec);border:1.5px solid #ffe1bd;border-radius:24px;padding:21px;margin-bottom:16px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero::after{content:"";position:absolute;right:-26px;top:-26px;width:130px;height:130px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,194,75,.45),transparent)}
.hero::before{content:"☀️";position:absolute;right:16px;top:14px;font-size:26px;opacity:.85}
.hero .label{font-size:12px;color:var(--dim);font-weight:700} .hero .big{font-family:var(--num);font-size:44px;font-weight:700;margin-top:6px;line-height:1;color:var(--accent)}
.hero .big small{font-size:19px;color:var(--dim)}
.ring{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;flex:none;background:conic-gradient(var(--accent) calc(var(--pct)*1%), #f1e4d0 0);box-shadow:0 4px 10px rgba(255,122,89,.22)}
.ring .inner{width:52px;height:52px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;font-family:var(--num);color:var(--text)}
.task{display:flex;align-items:center;gap:13px;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:14px;margin-bottom:11px;box-shadow:var(--shadow)}
.task.approved{opacity:.6} .task .tname{font-weight:800} .task .tsub{font-size:12px;color:var(--dim);margin-top:5px}
.mcard{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:15px;margin-bottom:12px;box-shadow:var(--shadow)}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;text-align:center}
.badge{aspect-ratio:1;border-radius:17px;background:linear-gradient(155deg,#fff,#fdf1e0);border:1.5px solid var(--line);display:grid;place-items:center;font-size:26px;box-shadow:var(--shadow);animation:pop .4s both}
.badge:nth-child(2){animation-delay:.04s}.badge:nth-child(3){animation-delay:.08s}.badge:nth-child(4){animation-delay:.12s}
.badge:nth-child(5){animation-delay:.16s}.badge:nth-child(6){animation-delay:.2s}.badge:nth-child(7){animation-delay:.24s}.badge:nth-child(8){animation-delay:.28s}
.badge.locked{opacity:.4;filter:grayscale(.7);box-shadow:none} .badge .l{font-size:9px;color:var(--dim);margin-top:3px;font-weight:700}
.day{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.day:last-child{border:none} .day .dn{width:42px;font-size:12px;color:var(--accent);font-weight:800;text-transform:uppercase}
.seg{display:flex;background:var(--bg2);border:1.5px solid var(--line);border-radius:13px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px;border-radius:10px;font-size:13px;color:var(--dim);font-weight:800}
.seg button.on{background:var(--accent);color:#fff;box-shadow:0 3px 8px rgba(255,122,89,.3)}
.nav{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-top:1.5px solid var(--line);display:flex;padding:9px 6px calc(9px + env(safe-area-inset-bottom));z-index:20;box-shadow:0 -6px 20px rgba(180,120,70,.08)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;color:var(--faint);font-size:10px;font-weight:800;transition:.15s}
.nav button.on{color:var(--accent)} .nav button.on svg{stroke:var(--accent)} .nav svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* Sheet móvil */
.sheet-bg{position:fixed;inset:0;background:rgba(67,53,42,.4);z-index:30;display:none} .sheet-bg.open{display:block;animation:rise .2s}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:var(--card);border-radius:26px 26px 0 0;border:1.5px solid var(--line);padding:22px 18px calc(24px + env(safe-area-inset-bottom));z-index:31;transform:translateY(100%);transition:.32s cubic-bezier(.2,.8,.2,1);max-height:85vh;overflow:auto;box-shadow:var(--shadow-lg)}
.sheet.open{transform:none} .sheet .grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 18px}
.sheet h3{font-size:18px}

/* Modal escritorio */
.modal-bg{position:fixed;inset:0;background:rgba(67,53,42,.45);z-index:40;display:none;place-items:center;padding:20px} .modal-bg.open{display:grid;animation:rise .2s}
.modal{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:26px;width:min(440px,92vw);max-height:88vh;overflow:auto;box-shadow:var(--shadow-lg)}
.modal h3{font-size:20px}

@media(min-width:861px){ .desk{display:block} }
@media(max-width:860px){ .mob{display:block} }

/* =========================================================
   SELECTOR DE PERFIL (¿quién está usando la app?)

   No es una pantalla de acceso: no pide nada, solo pregunta quién eres para
   abrir tu pantalla. Se dibuja mobile-first porque los tres hijos entran
   siempre desde el móvil; en pantalla grande se reparte en dos columnas.
   ========================================================= */
#picker{display:none}
.pick-shell{min-height:100vh;display:grid;place-items:center;padding:26px 18px calc(26px + env(safe-area-inset-bottom))}
.pick-card{width:100%;max-width:440px}
.pick-brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.pick-brand .dot{width:52px;height:52px;border-radius:17px;background:linear-gradient(150deg,var(--accent),var(--sun));display:grid;place-items:center;font-size:25px;box-shadow:0 8px 18px rgba(255,122,89,.3);transform:rotate(-4deg);flex:none}
.pick-brand h1{font-size:25px} .pick-brand .sub{font-size:13px;color:var(--dim);font-weight:700;margin-top:2px}
.pick-list{display:grid;gap:11px}
/* 64px de alto mínimo: pensado para pulgares, no para ratones. */
.pick-btn{display:flex;align-items:center;gap:14px;width:100%;min-height:68px;padding:13px 15px;
  background:var(--card);border:1.5px solid var(--line);border-radius:19px;box-shadow:var(--shadow);
  text-align:left;transition:transform .12s, box-shadow .15s}
.pick-btn:hover{box-shadow:var(--shadow-lg);transform:translateY(-1px)}
.pick-btn:active{transform:scale(.985)}
.pick-btn .av{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-size:23px;flex:none}
.pick-btn .nm{font-family:var(--num);font-weight:600;font-size:18px}
.pick-btn .rl{font-size:12px;color:var(--dim);font-weight:700;margin-top:2px}
.pick-btn .go{margin-left:auto;color:var(--faint);font-size:20px;flex:none}
.pick-btn.papas{background:linear-gradient(150deg,#fff,#f6f2ff);border-color:#e2daf7}
.pick-sep{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.08em;font-weight:800;margin:18px 0 10px}
.pick-note{font-size:12px;color:var(--faint);font-weight:600;text-align:center;margin-top:22px;line-height:1.5}
.pick-err{background:#fde0e0;color:var(--red);border:1.5px solid #f7c4c4;border-radius:14px;padding:12px 14px;font-size:13px;font-weight:700;margin-bottom:14px}
@media(min-width:700px){
  .pick-card{max-width:760px}
  .pick-list{grid-template-columns:1fr 1fr}
  .pick-list.uno{grid-template-columns:1fr}
}

/* =========================================================
   AJUSTES MÓVILES (360 / 390 / 430 px)

   La experiencia de los hijos se usa siempre en el móvil, así que en pantallas
   estrechas se aprieta el margen lateral y se agrandan las zonas pulsables.
   ========================================================= */
@media(max-width:430px){
  .mob .phone{padding-left:13px;padding-right:13px}
  .mob .head h1{font-size:19px}
  .btn{padding:13px 17px;min-height:46px}
  .btn.sm{padding:10px 13px;min-height:40px}
  .seg button{padding:11px 8px}
  .nav button{padding:8px 0}
  .sheet .btn.w{min-height:50px}
  input,select{padding:13px}
}
</style>
</head>
<body>
<div id="picker"></div>
<div class="modebar" id="modebar"></div>
<div class="desk" id="desk"></div>
<div class="mob" id="mob"></div>
<div class="sheet-bg" id="sheetBg" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"></div>
<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div>
<!-- Los cuatro perfiles de la casa. El mismo archivo lo carga el servidor con
     require(), para que no haya dos listas que puedan divergir. -->
<script src="/perfiles.js"></script>
<script>
// =========================================================================
//  HELPER FETCH
//
//  Cada petición dice desde qué perfil se hace (cabecera X-Perfil). No es una
//  credencial: no hay nada que verificar. Sirve para que el servidor sepa si
//  quien escribe es un hijo (que reporta tareas) o los papás (que validan y
//  cambian los ajustes de la casa).
// =========================================================================
async function api(url, opts){
  const o = Object.assign({}, opts||{});
  o.headers = Object.assign({ "X-Perfil": perfilActual() || PERFIL_POR_DEFECTO }, o.headers||{});
  if (o.body && typeof o.body !== "string") {
    o.body = JSON.stringify(o.body);
    o.headers["Content-Type"] = "application/json";
  }
  const r = await fetch(url, o);
  let data = null;
  try { data = await r.json(); } catch(e) {}
  if (!r.ok) {
    const err = new Error((data && data.error) || ("http_"+r.status));
    err.status = r.status; err.payload = data;
    throw err;
  }
  return data;
}

let _saveTimer=null, _lastSent=0;
// Copia del estado tal y como lo entregó el servidor la última vez. Sirve para
// saber QUÉ he cambiado yo si al guardar resulta que alguien escribió antes.
let _base=null;
const marcarBase=()=>{ try{ _base=JSON.parse(JSON.stringify(S)); }catch(e){ _base=null; } };

// Campos que son de este dispositivo y no viajan al servidor.
const LOCALES=["view","profile","deskTab","mobTab"];

// Fusión por campos: sobre el estado fresco del servidor se vuelven a aplicar
// los campos que YO había tocado desde mi última lectura.
// Es una fusión gruesa (por campo de primer nivel), no perfecta: si dos
// dispositivos tocan el MISMO campo, sigue ganando el último. Pero evita el
// caso habitual y sangrante: que un hijo marque una tarea y a la vez su padre
// cambie la paga, y uno de los dos cambios desaparezca sin avisar.
function fusionarCambios(fresco, mio, base){
  const salida={...fresco};
  if(!base) return {...mio, _version:fresco._version};
  Object.keys(mio).forEach(k=>{
    if(k==="_version"||LOCALES.includes(k)) return;
    const yoLoCambie = JSON.stringify(mio[k])!==JSON.stringify(base[k]);
    if(yoLoCambie) salida[k]=mio[k];
  });
  salida._version=fresco._version;
  return salida;
}

const Store = {
  read(){ return null; },
  write(s){
    clearTimeout(_saveTimer);
    _saveTimer=setTimeout(async()=>{
      _lastSent=Date.now();
      try{
        const r=await api("/api/state",{method:"PUT",body:s});
        S._version=r.version; marcarBase();
      }catch(e){
        if(e.status===409 && e.payload && e.payload.error==="version_desfasada"){
          await resolverConflicto();
        }else if(e.message!=="sin-pin"){
          showConn(false);
        }
      }
    },250);
  },
};

// Alguien guardó entre que leí y guardé. Se trae el estado fresco, se le
// vuelven a aplicar mis cambios y se reintenta UNA vez. Si vuelve a fallar,
// se adopta el del servidor y se avisa: mejor perder un cambio sabiéndolo que
// perderlo en silencio.
let _resolviendo=false;
async function resolverConflicto(){
  if(_resolviendo) return;
  _resolviendo=true;
  try{
    const fresco=await api("/api/state");
    const locales={}; LOCALES.forEach(k=>{ locales[k]=S[k]; });
    const fusionado=fusionarCambios(fresco, S, _base);
    S=Object.assign(fusionado, locales);
    ensureShape();
    const r=await api("/api/state",{method:"PUT",body:S});
    S._version=r.version; marcarBase();
    render({quiet:true});
  }catch(e){
    try{
      const fresco=await api("/api/state");
      const locales={}; LOCALES.forEach(k=>{ locales[k]=S[k]; });
      S=Object.assign(fresco, locales);
      ensureShape(); marcarBase(); render({quiet:true});
      showConn(true);
      alert("Otro dispositivo guardó al mismo tiempo y tu último cambio no se pudo aplicar. Revísalo, por favor.");
    }catch(e2){ showConn(false); }
  }finally{ _resolviendo=false; }
}
function showConn(ok){
  const el=document.getElementById("connDot"); if(!el)return;
  el.style.background = ok? "var(--green)" : "var(--red)";
  el.title = ok? "Conectado" : "Sin conexión con el servidor";
}

const esc=s=>String(s==null?"":s).replace(/[<>&"']/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;","'":"&#39;"}[c]));
// Color que se inserta dentro de un atributo style: solo se admite hexadecimal.
const escColor=c=>/^#[0-9a-fA-F]{6}$/.test(String(c||""))?String(c):"#9c8a76";
const fmt=n=>(Math.round(n*100)/100).toFixed(2);

const LOAD_LABEL={normal:"Normal",reducida:"Reducida",minima:"Mínima"};

const MEALS=["desayuno","comida","cena"];

// La semilla vive SOLO en el servidor (services/estadoService.js):
// tener una copia aqui significaba dos verdades que podian divergir.
let S = null; // se carga del servidor en bootstrap()
function ensureShape(){
  if(!S) return; // el estado aún no ha llegado del servidor
  // Campos de navegación (son de este dispositivo; el servidor no los manda)
  if(!S.deskTab) S.deskTab="home";
  if(!S.mobTab) S.mobTab="home";
  if(!S.profile) S.profile=perfilActual()||PERFIL_POR_DEFECTO;
  if(!S.view) S.view=esHijo(S.profile)?"mob":"desk";
  // Añade campos nuevos a estados guardados antes de tener mercado.
  if(!Array.isArray(S.listings)) S.listings=[];
  if(!Array.isArray(S.offers)) S.offers=[];
  if(!Array.isArray(S.marketLog)) S.marketLog=[];
  if(Array.isArray(S.extras)) S.extras.forEach(x=>{ if(x.listed===undefined) x.listed=false; });
  if(Array.isArray(S.fixedTasks)) S.fixedTasks.forEach(t=>{ if(!t.freq) t.freq="daily"; });
  if(!S.fixedState || typeof S.fixedState!=="object") S.fixedState={};

  // --- Migración de los menús -----------------------------------------------
  // Las familias antiguas guardaban los platos como texto suelto y el menú
  // como un plato por día. Ahora un plato es un objeto y cada día tiene
  // desayuno, comida y cena. Sin esta conversión, esas familias verían
  // "[object Object]" en el selector de platos.
  if(!Array.isArray(S.dishes)) S.dishes=[];
  S.dishes=S.dishes.map((p,i)=> (p && typeof p==="object")
    ? {id:p.id||("d"+i), name:p.name||"", type:MEALS.includes(p.type)?p.type:"comida", tags:Array.isArray(p.tags)?p.tags:[]}
    : {id:"d"+i, name:String(p), type:"comida", tags:[]}
  ).filter(p=>p.name);
  if(!S.menu || typeof S.menu!=="object") S.menu={};
  DAYS.forEach(d=>{
    const v=S.menu[d];
    if(v && typeof v==="object"){
      MEALS.forEach(m=>{ if(typeof v[m]!=="string") v[m]=""; });
    }else{
      // Antes era el nombre de un plato: se busca su id y se pone como comida.
      const encontrado=S.dishes.find(p=>p.name===v);
      S.menu[d]={desayuno:"", comida:encontrado?encontrado.id:"", cena:""};
    }
  });

  delete S.swaps; delete S.fixedInstances;
}

// ---- Reinicios de ciclo --------------------------------------------------
// El reinicio semanal y el mensual los decide EL SERVIDOR con su propio reloj
// (ver aplicarCiclos en routes/state.js). Antes los disparaba el reloj del
// dispositivo: bastaba con que un móvil tuviera la fecha mal puesta para
// reiniciar la semana o el mes de toda la familia. El cliente solo lee
// S.currentWeek / S.currentMonth; nunca los cambia.
const save=()=>Store.write(S);
const $=id=>document.getElementById(id);

function generateMonth(){
  // Repartir de nuevo borra el progreso y las validaciones del reparto anterior.
  if(S.generated && !confirm("Volver a repartir borrará el reparto actual, lo que tus hijos ya hayan marcado y los anuncios del mercado. ¿Continuar?")) return;
  // Fijas: una instancia por hijo (mismas tareas para todos)
  initFixedWeek();
  // El mercado se refiere a asignaciones que van a desaparecer: se cierra entero.
  S.listings.forEach(l=>{ if(l.status==="open") l.status="cancelled"; });
  S.offers.forEach(o=>{ if(o.status==="pending") o.status="rejected"; });
  // Adicionales: repartir por peso según disponibilidad
  const kids=children();
  const sumF=kids.reduce((s,c)=>s+LOAD[c.load],0)||1;
  const total=S.extraTasks.reduce((s,t)=>s+t.points,0);
  const bins=kids.map(c=>({id:c.id,target:(total*LOAD[c.load])/sumF,load:0}));
  const ordered=[...S.extraTasks].sort((a,b)=>b.points-a.points);
  S.extras=[];
  for(const t of ordered){
    bins.sort((a,b)=>(b.target-b.load)-(a.target-a.load));
    bins[0].load+=t.points;
    S.extras.push({id:uid("x"),taskId:t.id,memberId:bins[0].id,status:"pending"});
  }
  S.generated=true; save();
}

const fixedTask=id=>S.fixedTasks.find(t=>t.id===id);
const fixedStateOf=(childId,taskId)=>(S.fixedState[childId]||{})[taskId];
function fixedUnits(t){ return isDaily(t)?7:1; }
function initFixedWeek(){
  S.fixedState={};
  children().forEach(c=>{ S.fixedState[c.id]={};
    S.fixedTasks.forEach(t=>{ S.fixedState[c.id][t.id]= isDaily(t)?{days:[false,false,false,false,false,false,false]}:{status:"pending"}; });
  });
}
// Asegura que fixedState tiene forma correcta (nuevos hijos/tareas/cambios de frecuencia)
// Rellena las casillas que falten. Devuelve si ha cambiado algo, para poder
// guardarlo: una mutación local que no se guarda hace que el sondeo vea siempre
// diferencia con el servidor y repinte la pantalla cada 4 segundos.
// El servidor ya entrega el estado con forma completa; esto es red de seguridad.
function ensureFixedShape(){
  let cambio=false;
  if(!S.fixedState){ S.fixedState={}; cambio=true; }
  children().forEach(c=>{
    if(!S.fixedState[c.id]){ S.fixedState[c.id]={}; cambio=true; }
    S.fixedTasks.forEach(t=>{
      const cur=S.fixedState[c.id][t.id];
      if(!cur || isDaily(t)!==Array.isArray(cur.days)){
        S.fixedState[c.id][t.id]= isDaily(t)?{days:[false,false,false,false,false,false,false]}:{status:"pending"};
        cambio=true;
      }
    });
  });
  return cambio;
}
function fixedApprovedUnits(childId){
  let n=0;
  S.fixedTasks.forEach(t=>{ const st=fixedStateOf(childId,t.id); if(!st)return;
    if(isDaily(t)) n+=(st.days||[]).filter(Boolean).length; else n+=(st.status==="approved")?1:0; });
  return n;
}
function fixedTotalUnits(childId){ return S.fixedTasks.reduce((s,t)=>s+fixedUnits(t),0); }
const extraTask=id=>S.extraTasks.find(t=>t.id===id);

function fixedRatio(childId){
  const tot=fixedTotalUnits(childId); if(!tot) return 1;
  return fixedApprovedUnits(childId)/tot;
}
function extraPointsApproved(childId){
  return S.extras.filter(x=>x.memberId===childId&&x.status==="approved")
    .reduce((s,x)=>s+extraTask(x.taskId).points,0);
}
function extraPointsAssigned(childId){
  return S.extras.filter(x=>x.memberId===childId).reduce((s,x)=>s+extraTask(x.taskId).points,0);
}
// Puntos del mes (para nivel) = fijas aprobadas (10pts c/u) + adicionales aprobadas
function monthPoints(childId){
  return Math.max(0, fixedApprovedUnits(childId)*2 + extraPointsApproved(childId) + marketBountyNet(childId));
}
// Neto de PUNTOS por primas del mercado, solo de tareas ya APROBADAS.
// (afecta al nivel/premios; el dinero va por el esfuerzo de la tarea hecha)
function marketBountyNet(childId){
  let net=0;
  S.extras.filter(x=>x.status==="approved"&&x.bounty).forEach(x=>{
    if(x.bounty.to===childId) net+=x.bounty.points;
    if(x.bounty.from===childId) net-=x.bounty.points;
  });
  return net;
}
function money(childId){
  const ratio=fixedRatio(childId);
  const fixedEarned=ratio>=0.75?S.fixedPay:0;
  const canExtra=ratio>=1;
  const extraEarned=canExtra?extraPointsApproved(childId)*S.rate:0;
  return {ratio,fixedEarned,extraEarned,total:Math.max(0,fixedEarned+extraEarned),canExtra};
}
function levelOf(childId){ const p=monthPoints(childId); return {level:Math.floor(p/100)+1,into:p%100,points:p}; }

// ---- Premios y canjes ------------------------------------------------------
// Los puntos de una solicitud quedan RESERVADOS en cuanto se pide, aunque el
// padre aún no la haya aprobado. Si no, un hijo podría pedir tres premios con
// los puntos justos para uno.
const redemptions=()=>Array.isArray(S.redemptions)?S.redemptions:(S.redemptions=[]);
const rewardById=id=>(S.rewards||[]).find(r=>r.id===id)||{id:"",title:"(premio eliminado)",cost:0,type:"",stock:null,active:false};
function pointsCommitted(childId){
  return redemptions()
    .filter(c=>c.childId===childId && (c.status==="pending"||c.status==="approved"))
    .reduce((s,c)=>s+(c.cost||0),0);
}
// Lo que le queda de verdad para gastar.
function pointsAvailable(childId){
  return Math.max(0, monthPoints(childId) - pointsCommitted(childId));
}
const pendingRedemptions=()=>redemptions().filter(c=>c.status==="pending");
// ¿Quedan unidades de este premio? stock null = ilimitado.
function rewardStockLeft(r){
  if(r.stock==null) return Infinity;
  const usados=redemptions().filter(c=>c.rewardId===r.id && c.status==="approved").length;
  return Math.max(0, r.stock-usados);
}
function rewardAvailable(r){ return r.active!==false && rewardStockLeft(r)>0; }

function toggleFixedDay(childId,taskId,dayIdx){ const cur=fixedStateOf(childId,taskId); if(cur&&cur.days){ cur.days[dayIdx]=!cur.days[dayIdx]; save(); render(); } }

// Publicar una tarea adicional propia en el mercado.
function publishListing(assignmentId){
  const pts = Math.max(0, parseInt(($("plPoints")||{}).value,10) || 0);
  const trade = ($("plTrade")||{}).checked;
  const note = (($("plNote")||{}).value || "").trim();
  if(pts<=0 && !trade){ alert("Ofrece puntos o permite trueque (o ambos)."); return; }
  const x=S.extras.find(e=>e.id===assignmentId);
  if(!x || x.status!=="pending" || x.listed) return;
  S.listings.push({id:uid("l"), sellerId:x.memberId, assignmentId, taskId:x.taskId,
    pointsOffered:pts, acceptsTrade:!!trade, note, status:"open", createdAt:Date.now()});
  x.listed=true; save(); closeSheet(); render();
}
function cancelListing(listingId){
  const l=S.listings.find(x=>x.id===listingId); if(!l||l.status!=="open")return;
  l.status="cancelled";
  S.offers.filter(o=>o.listingId===listingId&&o.status==="pending").forEach(o=>o.status="rejected");
  const x=S.extras.find(e=>e.id===l.assignmentId); if(x)x.listed=false;
  save(); render();
}
// "Me la quedo": cierre directo por los puntos ofrecidos.
// "Me la quedo" ya NO cierra el trato de golpe: crea una solicitud que el
// vendedor tiene que aceptar, igual que el trueque. Antes un hermano podía
// quedarse la tarea de otro sin que este se enterara hasta después, y el
// vendedor no podía echarse atrás aunque hubiera puesto mal el precio.
function takeListing(listingId, bidderId){
  const l=S.listings.find(x=>x.id===listingId); if(!l||l.status!=="open"||bidderId===l.sellerId)return;
  const x=S.extras.find(e=>e.id===l.assignmentId); if(!x||x.status!=="pending")return;
  // Si ya había pedido esta misma tarea, no se duplica
  if(S.offers.some(o=>o.listingId===listingId&&o.bidderId===bidderId&&o.status==="pending")){
    alert("Ya has pedido esta tarea. Espera a que te responda."); closeSheet(); return;
  }
  S.offers.push({id:uid("o"), listingId, bidderId, kind:"take",
    offeredAssignmentId:"", offeredTaskId:"", pointsAsked:0,
    status:"pending", createdAt:Date.now()});
  save(); closeSheet(); render();
}
// Ofrecer un trueque: una de mis tareas a cambio (+ puntos opcionales que pido).
function submitTradeOffer(listingId, bidderId){
  const offeredId = ($("toTask")||{}).value;
  const pts = Math.max(0, parseInt(($("toPoints")||{}).value,10) || 0);
  const l=S.listings.find(x=>x.id===listingId); if(!l||l.status!=="open"||!l.acceptsTrade)return;
  const off=S.extras.find(e=>e.id===offeredId);
  if(!off || off.memberId!==bidderId || off.status!=="pending" || off.listed){ alert("Elige una tarea válida tuya."); return; }
  S.offers.push({id:uid("o"), listingId, bidderId, offeredAssignmentId:offeredId, offeredTaskId:off.taskId,
    pointsAsked:pts, status:"pending", createdAt:Date.now()});
  save(); closeSheet(); render();
}
function rejectOffer(offerId){ const o=S.offers.find(x=>x.id===offerId); if(o&&o.status==="pending"){o.status="rejected";save();render()} }
// El vendedor acepta un trueque: se intercambian las tareas (+ compensación en puntos).
// El vendedor acepta. Vale para los dos tipos de solicitud:
//   take  -> el otro se queda la tarea; si el vendedor ofrecía puntos, se los paga
//   trade -> se intercambian las dos tareas (+ compensación opcional)
function acceptOffer(offerId){
  const o=S.offers.find(x=>x.id===offerId); if(!o||o.status!=="pending")return;
  const l=S.listings.find(x=>x.id===o.listingId); if(!l||l.status!=="open")return;
  const sellerTask=S.extras.find(e=>e.id===l.assignmentId);
  if(!sellerTask||sellerTask.status!=="pending"){
    alert("Esa tarea ya no está disponible."); o.status="rejected"; save(); render(); return;
  }

  if(o.kind==="take"){
    sellerTask.memberId=o.bidderId; sellerTask.listed=false;
    if(l.pointsOffered>0) sellerTask.bounty={points:l.pointsOffered, from:l.sellerId, to:o.bidderId};
    S.marketLog.push({kind:"take", taskId:l.taskId, from:l.sellerId, to:o.bidderId, points:l.pointsOffered, at:Date.now()});
  }else{
    const bidderTask=S.extras.find(e=>e.id===o.offeredAssignmentId);
    if(!bidderTask||bidderTask.status!=="pending"){
      alert("La tarea que te ofrecían ya no está disponible."); o.status="rejected"; save(); render(); return;
    }
    sellerTask.memberId=o.bidderId; sellerTask.listed=false;
    bidderTask.memberId=l.sellerId;
    if(o.pointsAsked>0) sellerTask.bounty={points:o.pointsAsked, from:l.sellerId, to:o.bidderId};
    S.marketLog.push({kind:"trade", taskId:l.taskId, giveTaskId:o.offeredTaskId, from:l.sellerId, to:o.bidderId, points:o.pointsAsked, at:Date.now()});
  }

  o.status="accepted";
  l.status="closed";
  // El resto de solicitudes sobre ese anuncio se caen
  S.offers.filter(x=>x.listingId===l.id&&x.status==="pending").forEach(x=>x.status="rejected");
  save(); render();
}

// Contador de cosas pendientes por pestaña. Es el "aviso" de la app: sin

function deskBadge(tab){
  if(tab==="validate"){
    const extras=(S.extras||[]).filter(x=>x.status==="submitted").length;
    const fijas=children().reduce((n,k)=>n+(S.fixedTasks||[]).filter(t=>!isDaily(t))
      .filter(t=>{const st=fixedStateOf(k.id,t.id);return st&&st.status==="submitted";}).length,0);
    return extras+fijas;
  }
  if(tab==="rewards") return pendingRedemptions().length;
  return 0;
}

// El padre resuelve una solicitud. Aprobar consolida el gasto (los puntos ya
// estaban reservados); denegar los libera al borrar la solicitud del cómputo.
function resolveRedeem(id,decision){
  const c=redemptions().find(x=>x.id===id);
  if(!c || c.status!=="pending") return;
  c.status = decision==="approved" ? "approved" : "denied";
  c.resolvedAt = Date.now();
  save(); render();
}
function toggleReward(id){
  const r=(S.rewards||[]).find(x=>x.id===id); if(!r) return;
  r.active = r.active===false;
  save(); render();
}
function delReward(id){
  const r=(S.rewards||[]).find(x=>x.id===id); if(!r) return;
  const usados=redemptions().filter(c=>c.rewardId===id).length;
  const aviso = usados
    ? `"${r.title}" tiene ${usados} solicitud(es) en el historial. Si lo borras, esas líneas quedarán sin nombre. ¿Mejor desactivarlo?\n\n¿Borrar de todos modos?`
    : `¿Borrar "${r.title}"?`;
  if(!confirm(aviso)) return;
  // Las solicitudes pendientes de ese premio se cancelan: si no, reservarían
  // puntos de un premio que ya no existe.
  S.redemptions=redemptions().filter(c=>!(c.rewardId===id && c.status==="pending"));
  S.rewards=S.rewards.filter(x=>x.id!==id);
  save(); render();
}
function addReward(){
  const t=$("rwTitle").value.trim(); if(!t) return;
  const coste=parseInt($("rwCost").value,10);
  if(!coste || coste<1){ alert("Pon un coste en puntos."); return; }
  const stockTxt=($("rwStock")||{}).value;
  const stock=stockTxt===""||stockTxt==null?null:Math.max(0,parseInt(stockTxt,10)||0);
  S.rewards.push({id:uid("r"), title:t, cost:coste, type:($("rwType")||{}).value||"Privilegio", stock, active:true});
  save(); closeModal(); render();
}

        : (r.kind==="fixed"

            : `<button class="btn sm" onclick="setExtraStatus('${r.id}','late')">Marcar vencida</button>`);

// Descarga una copia del estado actual desde el servidor.
function downloadBackup(){
  const a=document.createElement("a");
  a.href="/api/backup"; a.download="";
  document.body.appendChild(a); a.click(); a.remove();
}
// Restaura el estado desde un archivo de copia elegido por el usuario.
function restoreBackup(input){
  const file=input.files && input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=async()=>{
    let data;
    try{ data=JSON.parse(reader.result); }catch(e){ alert("El archivo no es una copia válida."); return; }
    if(!data || !Array.isArray(data.members)){ alert("El archivo no parece una copia de esta app."); return; }
    if(!confirm("Esto reemplazará TODOS los datos actuales por los de la copia. ¿Continuar?")){ input.value=""; return; }
    try{
      await api("/api/restore",{method:"POST",body:data});
      S=data; ensureShape(); render();
      alert("Copia restaurada correctamente.");
    }catch(e){ alert("No se pudo restaurar. Inténtalo de nuevo."); }
    input.value="";
  };
  reader.readAsText(file);
}

    <span class="pill ${m.fixedEarned>0?'p-ok':'p-late'}">Paga fija ${m.fixedEarned>0?'✓':'en riesgo'}</span>
    <span class="pill ${m.canExtra?'p-extra':'p-pending'}">Extras ${m.canExtra?'desbloqueadas':'al 100% de fijas'}</span>
  </div></div>

  <div class="mcard">
    <div class="row" style="margin-bottom:8px"><b>Tus tareas fijas (esta semana)</b><span class="spacer"></span><span class="dim num" style="font-size:13px">${doneU}/${totU}</span></div>
    <div class="progress"><span style="width:${totU?doneU/totU*100:0}%;background:${m.ratio>=1?'var(--green)':m.ratio>=.75?'var(--cyan)':'var(--red)'}"></span></div>
    <p class="dim" style="font-size:12px;margin-top:8px">${m.ratio>=1?'¡Todo al día! Ya puedes ganar con las adicionales.':m.ratio>=.75?'Paga fija asegurada. Complétalas todas para desbloquear las extras.':'Llega al 75% para asegurar tu paga fija.'}</p>
  </div>
  ${S.generated?S.fixedTasks.map(t=>fixedCardMob(t,me.id)).join(""):`<div class="empty">El mes aún no está repartido.</div>`}

  ${extras.length?`<div class="sect-title" style="margin-top:18px">Adicionales (dinero extra)</div>
    ${extras.map(x=>extraRowMob(x,me.id)).join("")}`:""}`;
}
// Tarjeta de tarea fija en el móvil: diaria (7 casillas) o semanal (validación)
function fixedCardMob(t,meId){
  const st=fixedStateOf(meId,t.id)||{};
  if(isDaily(t)){
    const days=st.days||[false,false,false,false,false,false,false];
    const ti=todayIdx(); const done=days.filter(Boolean).length;
    return `<div class="mcard"><div class="row" style="margin-bottom:10px">
      <div class="tic" style="width:38px;height:38px;font-size:17px">${esc(t.icon)}</div>
      <div style="flex:1"><b>${esc(t.name)}</b><div class="dim" style="font-size:11px">Diaria · ${done}/7 días${done===7?' ✓':''}</div></div></div>
      <div style="display:flex;gap:6px">${days.map((d,i)=>`<button onclick="toggleFixedDay('${meId}','${t.id}',${i})" style="flex:1;aspect-ratio:1;border-radius:11px;border:1.5px solid ${d?'var(--green)':'var(--line)'};background:${d?'var(--green)':'#fff'};color:${d?'#fff':'var(--dim)'};font-weight:800;font-size:12px;font-family:var(--num);${i===ti?'box-shadow:0 0 0 2.5px var(--accent)':''}">${DAYLBL[i]}</button>`).join("")}</div>
    </div>`;
  }
  // Semanal: pasa por validación del padre
  const status=st.status||"pending";
  const lbl={pending:"Toca a ti",submitted:"Esperando visto bueno",approved:"Hecha ✓",late:"Vencida"}[status];
  const cls={pending:"p-pending",submitted:"p-wait",approved:"p-ok",late:"p-late"}[status];
  return `<div class="task ${status==="approved"?"approved":""}"><div class="tic" style="width:40px;height:40px;border-radius:11px;background:var(--card2);display:grid;place-items:center;font-size:18px">${esc(t.icon)}</div>
    <div style="flex:1"><div class="tname">${esc(t.name)}</div><div class="tsub"><span class="pill p-fixed" style="margin-right:5px">semanal</span><span class="pill ${cls}">${lbl}</span></div></div>
    <div style="text-align:right">${status==="pending"?`<button class="btn ok sm" onclick="setFixedStatus('${meId}','${t.id}','submitted')">Hecha</button>`:""}</div></div>`;
}
// Fila de tarea fija (no afectada por el mercado)
function taskRowMob(t,status,onMark,kind){
  const lbl={pending:"Toca a ti",submitted:"Esperando visto bueno",approved:"Aprobada ✓",late:"Vencida"}[status];
  const cls={pending:"p-pending",submitted:"p-wait",approved:"p-ok",late:"p-late"}[status];
  const pts=kind==="extra"?`+${t.points}`:"";
  return `<div class="task ${status==="approved"?"approved":""}"><div class="tic" style="width:40px;height:40px;border-radius:11px;background:var(--card2);display:grid;place-items:center;font-size:18px">${esc(t.icon)}</div>
    <div style="flex:1"><div class="tname">${esc(t.name)}</div><div class="tsub"><span class="pill ${cls}">${lbl}</span></div></div>
    <div style="text-align:right">${pts?`<div class="pts">${pts}</div>`:""}
    ${status==="pending"?`<button class="btn ok sm" style="margin-top:6px" onclick="${onMark()}">Hecha</button>`:""}</div></div>`;
}
// Fila de tarea adicional (puede estar en venta o tener prima de mercado)
function extraRowMob(x,meId){
  const t=extraTask(x.taskId);
  const lbl={pending:"Toca a ti",submitted:"Esperando visto bueno",approved:"Aprobada ✓",late:"Vencida"}[x.status];
  const cls={pending:"p-pending",submitted:"p-wait",approved:"p-ok",late:"p-late"}[x.status];
  // Prima de mercado pactada sobre esta tarea
  let bounty="";
  if(x.bounty){
    if(x.bounty.to===meId) bounty=`<div class="dim" style="font-size:11px;color:var(--green)">+${x.bounty.points} pts de mercado</div>`;
    else if(x.bounty.from===meId) bounty=`<div class="dim" style="font-size:11px;color:var(--red)">−${x.bounty.points} pts de mercado</div>`;
  }
  return `<div class="task ${x.status==="approved"?"approved":""}"><div class="tic" style="width:40px;height:40px;border-radius:11px;background:var(--card2);display:grid;place-items:center;font-size:18px">${esc(t.icon)}</div>
    <div style="flex:1"><div class="tname">${esc(t.name)}</div>
      <div class="tsub">${x.listed?`<span class="pill p-extra">🏷️ en el mercado</span>`:`<span class="pill ${cls}">${lbl}</span>`}</div>${bounty}</div>
    <div style="text-align:right"><div class="pts">+${t.points}</div>
    ${x.status==="pending"&&!x.listed?`<button class="btn ok sm" style="margin-top:6px" onclick="setExtraStatus('${x.id}','submitted')">Hecha</button>`:""}
    ${x.listed?`<button class="btn ghost sm" style="margin-top:6px;color:var(--red)" onclick="cancelListingByAssignment('${x.id}')">Retirar</button>`:""}</div></div>`;
}
// Atajo: retirar del mercado desde la pantalla de inicio
function cancelListingByAssignment(assignmentId){
  const l=S.listings.find(x=>x.assignmentId===assignmentId && x.status==="open");
  if(l) cancelListing(l.id);
}

// ===================== VISTA MERCADO (HIJO) =====================
function mMarket(){
  const me=member(S.profile);
  if(!S.generated) return `<div class="empty">El mes aún no está repartido.<br>Cuando tus padres asignen las tareas adicionales, podrás venderlas o cambiarlas aquí.</div>`;

  const sellable=S.extras.filter(x=>x.memberId===me.id && x.status==="pending" && !x.listed);
  const myListings=S.listings.filter(l=>l.sellerId===me.id && l.status==="open");
  const incoming=S.offers.filter(o=>o.status==="pending" && S.listings.some(l=>l.id===o.listingId && l.sellerId===me.id && l.status==="open"));
  const board=S.listings.filter(l=>l.status==="open" && l.sellerId!==me.id);
  const log=S.marketLog.slice(-6).reverse();
  const t=id=>extraTask(id);

  let html=`<p class="dim" style="font-size:13px;margin:0 4px 16px">Vende una tarea ofreciendo puntos a quien la haga, o cámbiala por otra. Os organizáis entre vosotros.</p>`;

  // --- Solicitudes recibidas (te piden una tarea o te ofrecen un cambio) ---
  if(incoming.length){
    html+=`<div class="sect-title">📥 Te han pedido algo (${incoming.length})</div>`;
    incoming.forEach(o=>{
      const l=S.listings.find(x=>x.id===o.listingId);
      const quien=esc(member(o.bidderId).name);
      const esTake=o.kind==="take";
      html+=`<div class="mcard" style="border-color:${esTake?"var(--accent)":"var(--violet)"}">
        <div class="row"><span class="pill ${esTake?"p-wait":"p-extra"}">${esTake?"te la pide":"trueque"}</span>
          <span class="spacer"></span><span class="dim" style="font-size:12px">de ${quien}</span></div>
        <div style="margin:10px 0;font-size:14px;font-weight:700">${quien} hará tu <b>${esc(t(l.taskId).icon)} ${esc(t(l.taskId).name)}</b></div>
        ${esTake
          ? (l.pointsOffered>0
              ? `<div class="row" style="font-size:13px"><span class="dim">Le darás</span><span class="spacer"></span><span class="pts">${l.pointsOffered} pts</span></div>`
              : `<div class="dim" style="font-size:13px">Sin puntos de por medio.</div>`)
          : `<div class="row" style="font-size:13px"><span class="dim">A cambio tú harás:</span><span class="spacer"></span><span>${esc(t(o.offeredTaskId).icon)} ${esc(t(o.offeredTaskId).name)} <span class="pts">${t(o.offeredTaskId).points}</span></span></div>
             ${o.pointsAsked>0?`<div class="row" style="font-size:13px;margin-top:6px"><span class="dim">Te pide además:</span><span class="spacer"></span><span class="pts">${o.pointsAsked} pts</span></div>`:""}`}
        <div class="row" style="gap:8px;margin-top:12px">
          <button class="btn ok sm" style="flex:1" onclick="acceptOffer('${esc(o.id)}')">Aceptar</button>
          <button class="btn sm" style="flex:1" onclick="rejectOffer('${esc(o.id)}')">Rechazar</button>
        </div></div>`;
    });
  }

  // --- Mis anuncios activos ---
  if(myListings.length){
    html+=`<div class="sect-title" style="margin-top:18px">🏷️ Tus anuncios</div>`;
    myListings.forEach(l=>{
      const offs=S.offers.filter(o=>o.listingId===l.id && o.status==="pending");
      html+=`<div class="mcard"><div class="row">
        <div class="tic" style="width:38px;height:38px;font-size:17px">${esc(t(l.taskId).icon)}</div>
        <div style="flex:1"><div style="font-weight:800">${esc(t(l.taskId).name)}</div>
          <div class="dim" style="font-size:12px">${l.pointsOffered>0?`Ofreces ${l.pointsOffered} pts`:""}${l.pointsOffered>0&&l.acceptsTrade?" · ":""}${l.acceptsTrade?"Acepta trueque":""}</div></div>
        <span class="pts">${t(l.taskId).points}</span></div>
        <div class="row" style="margin-top:10px"><span class="dim" style="font-size:12px">${offs.length?offs.length+" oferta(s) de trueque":"Aún sin ofertas"}</span>
        <span class="spacer"></span><button class="btn ghost sm" style="color:var(--red)" onclick="cancelListing('${l.id}')">Retirar</button></div></div>`;
    });
  }

  // --- Tablón de anuncios de los hermanos ---
  html+=`<div class="sect-title" style="margin-top:18px">🛒 Tablón de la familia</div>`;
  if(!board.length){
    html+=`<div class="empty" style="padding:18px">Nadie ha puesto tareas ahora mismo.</div>`;
  }else{
    board.forEach(l=>{
      html+=`<div class="mcard"><div class="row">
        <div class="tic" style="width:42px;height:42px;font-size:19px">${esc(t(l.taskId).icon)}</div>
        <div style="flex:1"><div style="font-weight:800">${esc(t(l.taskId).name)}</div>
          <div class="dim" style="font-size:12px">de ${esc(member(l.sellerId).name)} · esfuerzo ${t(l.taskId).points}</div></div>
        ${l.pointsOffered>0?`<div style="text-align:right"><div class="pts">+${l.pointsOffered}</div><div class="dim" style="font-size:10px">pts extra</div></div>`:""}</div>
        ${l.note?`<div class="dim" style="font-size:12px;margin-top:8px;font-style:italic">"${esc(l.note)}"</div>`:""}
        <div class="row" style="gap:8px;margin-top:12px">
          ${yaPedida(l.id)
            ? `<button class="btn sm" style="flex:1" disabled>Ya se la has pedido</button>`
            : `<button class="btn primary sm" style="flex:1" onclick="confirmTake('${esc(l.id)}')">Pedírsela${l.pointsOffered>0?` (+${l.pointsOffered})`:""}</button>`}
          ${l.acceptsTrade?`<button class="btn sm" style="flex:1" onclick="sheetTrade('${l.id}')">Ofrecer trueque</button>`:""}
        </div></div>`;
    });
  }

  // --- Mis tareas para poner en venta ---
  html+=`<div class="sect-title" style="margin-top:18px">📦 Tus tareas adicionales</div>`;
  if(!sellable.length){
    html+=`<div class="empty" style="padding:18px">No tienes tareas adicionales libres para vender.</div>`;
  }else{
    sellable.forEach(x=>{
      html+=`<div class="task"><div class="tic" style="width:40px;height:40px;font-size:18px">${esc(t(x.taskId).icon)}</div>
        <div style="flex:1"><div class="tname">${esc(t(x.taskId).name)}</div><div class="tsub">${t(x.taskId).points} pts de esfuerzo</div></div>
        <button class="btn sm" onclick="sheetPublish('${x.id}')">Vender / cambiar</button></div>`;
    });
  }

  // --- Historial ---
  if(log.length){
    html+=`<div class="sect-title" style="margin-top:18px">🧾 Movimientos recientes</div>`;
    log.forEach(m=>{
      const desc = m.kind==="take"
        ? `${esc(member(m.to).name)} se quedó <b>${esc(t(m.taskId).icon)} ${esc(t(m.taskId).name)}</b> de ${esc(member(m.from).name)}${m.points>0?` (+${m.points} pts)`:""}`
        : `${esc(member(m.from).name)} y ${esc(member(m.to).name)} cambiaron <b>${esc(t(m.taskId).icon)}</b> ↔ <b>${m.giveTaskId?t(m.giveTaskId).icon:""}</b>${m.points>0?` (+${m.points} pts)`:""}`;
      html+=`<div class="mcard" style="padding:11px 14px"><div style="font-size:13px">${desc}</div></div>`;
    });
  }

  return html;
}

      <div style="flex:1"><div style="font-weight:700;font-size:14px">${esc(rewardById(c.rewardId).title)}</div>
        <div class="dim" style="font-size:11px;margin-top:3px">${c.cost} pts</div></div>
      <span class="pill ${CLASE[c.status]}">${ETIQ[c.status]}</span></div>
      ${c.status==="pending"?`<button class="btn ghost sm w" style="margin-top:8px;color:var(--red)" onclick="cancelRedeem('${esc(c.id)}')">Cancelar solicitud</button>`:""}
    </div>`).join("")}`:""}

  <div class="sect-title" style="margin-top:18px">Premios</div>
  ${(S.rewards||[]).filter(rewardAvailable).map(r=>{
    const puede=libres>=r.cost;
    const quedan=rewardStockLeft(r);
    return `<div class="mcard"><div class="row"><div><div style="font-weight:500">${esc(r.title)}</div>
      <div class="dim" style="font-size:12px">${esc(r.type)}${quedan!==Infinity?` · quedan ${quedan}`:""}</div></div>
      <span class="spacer"></span><span class="pts">${r.cost}</span></div>
    <button class="btn ${puede?"primary":""} w sm" style="margin-top:12px${puede?"":";opacity:.45"}" ${puede?`onclick="sheetRedeem('${esc(r.id)}')"`:"disabled"}>${puede?"Canjear":`Te faltan ${r.cost-libres} pts`}</button></div>`;
  }).join("")||'<div class="empty">Tus padres aún no han puesto premios.</div>'}`;
}

function sheetRedeem(id){
  const r=rewardById(id); if(!r.id) return;
  const me=member(S.profile);
  openSheet(`<h3 style="margin-bottom:10px">Canjear premio</h3>
    <p class="dim" style="font-size:14px;margin-bottom:8px">Vas a pedir "<b style="color:var(--text)">${esc(r.title)}</b>" por <b style="color:var(--text)">${r.cost} pts</b>.</p>
    <p class="dim" style="font-size:13px;margin-bottom:18px">Los puntos se te reservan ahora. Cuando tus padres lo aprueben, se descontarán; si lo deniegan, los recuperas.</p>
    <button class="btn primary w" onclick="doRedeem('${esc(id)}')">Enviar solicitud</button>`);
}

// El hijo pide el premio: se crea la solicitud y los puntos quedan reservados.
function doRedeem(rewardId){
  const r=rewardById(rewardId); if(!r.id) return;
  const me=member(S.profile);
  if(!rewardAvailable(r)){ alert("Ese premio ya no está disponible."); closeSheet(); render(); return; }
  if(pointsAvailable(me.id)<r.cost){ alert("No te llegan los puntos."); closeSheet(); render(); return; }
  redemptions().push({id:uid("c"), rewardId, childId:me.id, cost:r.cost, status:"pending", at:Date.now(), resolvedAt:0});
  save(); closeSheet(); render();
}
function cancelRedeem(id){
  const c=redemptions().find(x=>x.id===id);
  if(!c || c.status!=="pending") return;
  if(!confirm("¿Cancelar la solicitud? Recuperas los puntos.")) return;
  S.redemptions=redemptions().filter(x=>x.id!==id);
  save(); render();
}
// Hoja de perfil: quién está usando la app y cómo cambiar de persona.
// Vale igual para el móvil de un hijo y para el Dashboard de los Papás.
// No hay nada de cuenta que gestionar: no existen cuentas.
function sheetPerfil(){
  const p=perfilInfo();
  const otros=PERFILES.filter(x=>x.id!==p.id);
  openSheet(`<h3 style="margin-bottom:6px">Estás usando la app como</h3>
    <div class="row" style="margin:14px 0 20px">
      <span class="avatar" style="width:48px;height:48px;font-size:23px;background:${escColor(p.color)}1f;color:${escColor(p.color)}">${esc(p.emoji)}</span>
      <div><div style="font-family:var(--num);font-weight:600;font-size:19px">${esc(p.shortName||p.name)}</div>
        <div class="dim" style="font-size:12px">${p.role==="parent"?"Podéis validar tareas y cambiar los ajustes de la casa":"Marcas tus tareas; tus papás las validan"}</div></div></div>
    <div class="sect-title">Cambiar a</div>
    ${otros.map(o=>`<button class="btn w" style="margin-bottom:9px;justify-content:flex-start;gap:12px" onclick="elegirPerfil('${esc(o.id)}')">
      <span class="avatar" style="width:32px;height:32px;font-size:17px;background:${escColor(o.color)}1f;color:${escColor(o.color)}">${esc(o.emoji)}</span>
      ${esc(o.shortName||o.name)}</button>`).join("")}
    <button class="btn ghost w" style="margin-top:10px" onclick="cambiarDePerfil()">Ver todos los perfiles</button>`);
}

// Sheet helpers
function openSheet(h){ $("sheet").innerHTML=`<div class="grab"></div>${h}`; $("sheet").classList.add("open"); $("sheetBg").classList.add("open"); }
function closeSheet(){ $("sheet").classList.remove("open"); $("sheetBg").classList.remove("open"); }


// =========================================================================
//  RENDER PRINCIPAL
// =========================================================================
function renderModebar(){
  const p=perfilInfo();
  $("modebar").innerHTML=`<span style="font-weight:800">🏠 Casa</span>
    <span class="dim" style="font-size:12px">· ${esc(p.emoji)} ${esc(p.shortName||p.name)}</span>
    <span class="spacer"></span>
    <span class="dim" style="font-size:12px">${esc(monthName(S.currentMonth))}</span>
    <span id="connDot" title="Conectado" style="width:9px;height:9px;border-radius:50%;background:var(--green);display:inline-block;margin:0 4px 0 8px"></span>
    <button class="btn ghost sm" style="padding:5px 10px" onclick="sheetPerfil()">Cambiar</button>`;
}
// quiet: repintado provocado por el sondeo, no por el usuario. Se salta la
// animación de entrada para que la pantalla no "parpadee" sola cada pocos
// segundos cuando otro dispositivo cambia algo.
let _quiet=false;
function render(opts){
  _quiet=!!(opts&&opts.quiet);
  if(ensureFixedShape()) save(); // si faltaba forma, se guarda (si no, bucle)
  renderModebar();
  if(S.view==="desk"){
    $("desk").style.display="block"; $("mob").style.display="none";
    renderDesk();
  }else{
    $("desk").style.display="none"; $("mob").style.display="block";
    // La pantalla de móvil siempre pinta a un hijo. Si el perfil abierto no lo
    // es (o su ficha aún no ha llegado del servidor), se cae al primero.
    if(!member(S.profile) || member(S.profile).role!=="child"){
      const kid=children()[0];
      if(!kid) return showFatal("No hay ningún hijo configurado en la casa.");
      S.profile=kid.id;
    }
    renderMob();
  }
}
// ============== ARRANQUE: elegir perfil → app ==============
//
// No hay inicio de sesión. Al abrir, la app pregunta quién eres (o lo recuerda
// de la última vez) y entra directamente en tu pantalla.
//
// PERFIL guarda quién está usando ESTE dispositivo. Es de este navegador y no
// viaja dentro del estado compartido: si viajara, cambiar de perfil en el móvil
// de Carla le cambiaría la pantalla a todos los demás.
const PERFIL_KEY="casa_perfil_v1";
let PERFIL=null;

function perfilActual(){
  if(PERFIL) return PERFIL;
  try{
    const guardado=localStorage.getItem(PERFIL_KEY);
    if(esPerfilValido(guardado)) PERFIL=guardado;
  }catch(e){}
  return PERFIL;
}
function recordarPerfil(id){
  PERFIL=id;
  try{ localStorage.setItem(PERFIL_KEY,id); }catch(e){}
}
function olvidarPerfil(){
  PERFIL=null;
  try{ localStorage.removeItem(PERFIL_KEY); }catch(e){}
}
// Datos del perfil abierto ahora mismo (nombre, color, emoji…).
const perfilInfo=()=>perfilPorId(perfilActual())||PAPAS;

async function bootstrap(){
  clearInterval(_poll);
  if(!perfilActual()) return mostrarSelector();
  await abrirPerfil(perfilActual());
}

// Pantalla de selección. Cuatro botones grandes y nada que rellenar.
function mostrarSelector(aviso){
  // Hay que parar el sondeo. Si no, cuatro segundos después llegaría el estado
  // del servidor, se repintaría la app y aparecería ENCIMA del selector.
  clearInterval(_poll);
  olvidarPerfil();
  $("desk").style.display="none";
  $("mob").style.display="none";
  $("modebar").style.display="none";
  const boton=(p)=>`<button class="pick-btn${p.role==="parent"?" papas":""}" onclick="elegirPerfil('${esc(p.id)}')">
      <span class="av" style="background:${escColor(p.color)}1f;color:${escColor(p.color)}">${esc(p.emoji)}</span>
      <span><span class="nm">${esc(p.shortName||p.name)}</span>
        <span class="rl">${p.role==="parent"?"Panel de la casa · ordenador":"Tus tareas y tu paga · móvil"}</span></span>
      <span class="go">›</span></button>`;
  const hijos=PERFILES.filter(p=>p.role==="child");
  const papas=PERFILES.filter(p=>p.role==="parent");
  $("picker").style.display="block";
  $("picker").innerHTML=`<div class="pick-shell"><div class="pick-card">
    <div class="pick-brand"><span class="dot">🏠</span>
      <div><h1>Casa</h1><div class="sub">¿Quién eres?</div></div></div>
    ${aviso?`<div class="pick-err">${esc(aviso)}</div>`:""}
    <div class="pick-sep">Los hijos</div>
    <div class="pick-list">${hijos.map(boton).join("")}</div>
    <div class="pick-sep">Los papás</div>
    <div class="pick-list uno">${papas.map(boton).join("")}</div>
    <p class="pick-note">Se recuerda tu elección en este dispositivo.<br>Puedes cambiarla cuando quieras desde arriba.</p>
  </div></div>`;
}

async function elegirPerfil(id){
  if(!esPerfilValido(id)) return;
  // Se llama desde la hoja de "cambiar de perfil": hay que cerrarla, o la
  // pantalla nueva aparecería con la anterior encima.
  closeSheet(); closeModal();
  recordarPerfil(id);
  // Cada persona tiene su propia pestaña abierta: al cambiar de perfil se
  // vuelve al inicio en lugar de heredar la sección del anterior.
  try{ localStorage.removeItem(TAB_KEY); }catch(e){}
  await abrirPerfil(id);
}

// Cambiar de perfil = volver al selector. Un solo gesto, sin confirmaciones.
function cambiarDePerfil(){
  closeSheet(); closeModal();
  mostrarSelector();
}

async function abrirPerfil(id){
  try{
    S = await api("/api/state");
    showConn(true);
    ensureShape();
    marcarBase();          // punto de partida para detectar mis propios cambios
    restaurarPestanas();
    // La vista sale del perfil: los papás al panel de escritorio, los hijos a
    // su pantalla de móvil.
    S.profile = id;
    S.view = esHijo(id) ? "mob" : "desk";
    $("picker").style.display = "none";
    $("modebar").style.display = "";
    render();
    startPolling();
  }catch(e){
    showFatal("No se pudo cargar la casa. Comprueba la conexión y vuelve a intentarlo.");
  }
}

function showFatal(msg){
  clearInterval(_poll);
  $("desk").style.display="none";
  $("mob").style.display="none";
  $("modebar").style.display="none";
  $("picker").style.display="block";
  $("picker").innerHTML=
    '<div class="pick-shell"><div class="pick-card">'+
    '<div class="pick-brand"><span class="dot">🏠</span><div><h1>Casa</h1>'+
    '<div class="sub">Algo no ha ido bien</div></div></div>'+
    '<div class="pick-err">'+esc(msg)+'</div>'+
    '<button class="btn primary w" onclick="location.reload()">Reintentar</button>'+
    '<button class="btn ghost w" style="margin-top:10px" onclick="mostrarSelector()">Elegir otro perfil</button>'+
    '</div></div>';
}

// Sondeo cada 4 s (solo cuando la app está activa)
let _poll=null;
function startPolling(){
  clearInterval(_poll);
  _poll=setInterval(async()=>{
    if(Date.now()-_lastSent<1500) return;
    // no repintar por debajo de alguien que está rellenando un campo
    const foco=document.activeElement;
    if(foco && /^(INPUT|SELECT|TEXTAREA)$/.test(foco.tagName)) return;
    // ni con una hoja o un diálogo abiertos
    if($("sheet").classList.contains("open") || $("modalBg").classList.contains("open")) return;
    try{
      const remote = await api("/api/state");
      showConn(true);
      // preserva lo que es de este dispositivo; adopta el resto si cambió
      const local={view:S.view,profile:S.profile,deskTab:S.deskTab,mobTab:S.mobTab};
      if(JSON.stringify(stripLocal(remote))!==JSON.stringify(stripLocal(S))){
        S=remote; Object.assign(S,local);
        ensureShape();
        marcarBase();        // lo que acabo de adoptar pasa a ser mi punto de partida
        render({quiet:true}); // sincronización de fondo: sin animación de entrada
      }else{
        // Aunque el contenido sea igual, la versión puede haber avanzado.
        S._version=remote._version;
      }
    }catch(e){
      showConn(false);
    }
  },4000);
}
// Campos que son de ESTE dispositivo y por tanto no cuentan como "ha cambiado
// algo en la casa". Sin esto, cambiar de pestaña en un móvil repintaría la
// pantalla de todos los demás y les movería la sección abierta.
// _version también se ignora: que suba el contador no es "ha cambiado algo",
// y si contara provocaría un repintado en cada vuelta del sondeo.
function stripLocal(o){ const c={...o}; delete c.view; delete c.profile; delete c.deskTab; delete c.mobTab; delete c._version; return c; }

// ---------------------------------------------------------------------------
//  Modo demo (/demo)
//  Carga demo.js, que sustituye api() por un servidor falso en memoria. Sirve
//  para enseñar la app sin tocar los datos de casa: en modo demo NO sale ni
//  una petición al servidor. Hay que cargarlo ANTES de bootstrap(), porque si
//  no la app ya habría llamado a la API de verdad.
// ---------------------------------------------------------------------------
function esModoDemo(){
  return location.pathname === "/demo" ||
         location.pathname === "/demo/" ||
         (location.hash||"").replace(/^#\/?/,"").split("?")[0] === "demo";
}
if (esModoDemo()) {
  const _sDemo = document.createElement("script");
  _sDemo.src = "/demo.js";
  _sDemo.onload = () => bootstrap();
  _sDemo.onerror = () => showFatal("No se pudo cargar la demo.");
  document.head.appendChild(_sDemo);
} else {
  bootstrap();
}

// Service worker: hace la app instalable (requisito de Google Play para poder
// publicarla como TWA) y que abra al instante. Nunca cachea /api/ — ver sw.js.
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("/sw.js").catch(()=>{ /* sin SW la app funciona igual */ });
  });
}

</script>
