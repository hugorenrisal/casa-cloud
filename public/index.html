<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#fff5e9" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Casa · tareas en familia</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
<style>
:root{
  /* ----- Paleta cálida "hogar soleado" ----- */
  --bg:#fef6ea;          /* crema papel */
  --bg2:#f5ead8;         /* crema más cálido (inputs, tracks) */
  --card:#ffffff;        /* tarjetas blancas */
  --card2:#fdf3e6;       /* relleno suave */
  --line:#efe1cc;        /* líneas cálidas */
  --text:#43352a;        /* marrón cálido oscuro */
  --dim:#9c8a76;         /* texto secundario */
  --faint:#c3b4a0;       /* texto muy tenue */

  --accent:#ff7a59;      /* coral alegre (acción principal) */
  --accent-ink:#ffffff;  /* texto sobre coral */
  --sun:#ffc24b;         /* amarillo sol */
  --green:#2fae73;       /* verde menta/hoja */
  --amber:#f59331;       /* mandarina */
  --red:#ef5b5b;         /* rojo suave */
  --cyan:#2f9fd0;        /* azul cielo */
  --violet:#8b6fd6;      /* uva */

  --shadow:0 8px 22px rgba(180,120,70,.10), 0 2px 6px rgba(180,120,70,.06);
  --shadow-lg:0 14px 40px rgba(180,120,70,.16);
  --r:20px;
  --num:"Fredoka",ui-rounded,system-ui,sans-serif;
  font-family:"Nunito",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);min-height:100vh}
body{
  background-image:
    radial-gradient(520px 320px at 88% -6%, rgba(255,194,75,.22), transparent 60%),
    radial-gradient(460px 300px at -8% 4%, rgba(255,122,89,.14), transparent 60%),
    radial-gradient(600px 400px at 50% 108%, rgba(47,159,208,.10), transparent 60%);
  background-attachment:fixed;
}
h1,h2,h3{margin:0;font-family:var(--num);font-weight:600;letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;font-size:15px;background:var(--bg2);border:1.5px solid var(--line);color:var(--text);border-radius:12px;padding:11px 13px;width:100%;font-weight:600}
input:focus,select:focus{outline:none;border-color:var(--accent);background:#fff}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;font-weight:600}
.dim{color:var(--dim)} .faint{color:var(--faint)}
.screen{animation:rise .4s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.8);opacity:0}60%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}

.pill{font-size:11px;padding:5px 11px;border-radius:999px;font-weight:700;display:inline-flex;align-items:center;gap:5px}
.p-pending{background:#f0e7d8;color:#9c8a76}
.p-wait{background:#fff0d6;color:var(--amber)}
.p-ok{background:#d9f5e7;color:var(--green)}
.p-late{background:#fde0e0;color:var(--red)}
.p-fixed{background:#d9eefa;color:var(--cyan)}
.p-extra{background:#eae6fb;color:var(--violet)}
.pts{font-family:var(--num);font-weight:700;color:var(--accent)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 17px;border-radius:14px;font-weight:800;font-size:14px;background:#fff;border:1.5px solid var(--line);color:var(--text);transition:transform .12s, box-shadow .15s}
.btn:hover{box-shadow:var(--shadow)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 6px 16px rgba(255,122,89,.32)}
.btn.primary:hover{box-shadow:0 8px 22px rgba(255,122,89,.42)}
.btn.sm{padding:8px 13px;font-size:13px;border-radius:11px}
.btn.ok{background:#d9f5e7;color:var(--green);border-color:#bfead4}
.btn.ghost{background:transparent;box-shadow:none}
.btn:active{transform:scale(.96)} .btn:disabled{opacity:.45;cursor:default;box-shadow:none}
.btn.w{width:100%}

.card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card.glow{background:linear-gradient(160deg,#ffffff,#fff4e2);border-color:#ffe3bb}
.row{display:flex;align-items:center;gap:10px} .spacer{flex:1}
.field{margin-bottom:13px} .field label{font-size:12px;color:var(--dim);display:block;margin-bottom:6px;font-weight:700}
.sect-title{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;font-weight:800;margin:4px 0 10px}
.empty{text-align:center;color:var(--faint);padding:32px 10px;font-size:14px;font-weight:600}
.preview-tag{display:inline-block;font-size:10px;font-weight:800;color:var(--violet);background:#eae6fb;padding:3px 9px;border-radius:7px;margin-left:8px}
.avatar{border-radius:14px;display:grid;place-items:center;font-weight:800;flex:none;font-family:var(--num)}
.progress{height:11px;background:var(--bg2);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.progress>span{display:block;height:100%;border-radius:999px;transition:width .6s cubic-bezier(.2,.8,.2,1)}

/* ===== Barra de modo (demo) ===== */
.modebar{position:fixed;top:0;left:0;right:0;z-index:50;background:rgba(254,246,234,.86);backdrop-filter:blur(12px);border-bottom:1.5px solid var(--line);display:flex;align-items:center;gap:10px;padding:9px 16px;font-size:13px;font-weight:700}
.modebar .seg{display:flex;background:var(--bg2);border:1.5px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.modebar .seg button{padding:6px 13px;border-radius:9px;font-size:12px;color:var(--dim);font-weight:800}
.modebar .seg button.on{background:var(--accent);color:#fff;box-shadow:0 3px 8px rgba(255,122,89,.3)}

/* =========================================================
   ESCRITORIO (padre)
   ========================================================= */
.desk{display:none}
.desk .wrap{max-width:1240px;margin:0 auto;padding:64px 26px 48px;display:grid;grid-template-columns:230px 1fr;gap:26px}
.side{position:sticky;top:64px;align-self:start}
.side .brand{display:flex;align-items:center;gap:11px;margin-bottom:24px;padding:0 4px}
.side .brand .dot{width:46px;height:46px;border-radius:15px;background:linear-gradient(150deg,var(--accent),var(--sun));display:grid;place-items:center;font-size:22px;box-shadow:0 8px 18px rgba(255,122,89,.3);transform:rotate(-4deg)}
.side nav{display:flex;flex-direction:column;gap:5px}
.side nav button{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;color:var(--dim);font-weight:800;font-size:14px;text-align:left;width:100%;transition:.15s}
.side nav button.on{background:#fff;color:var(--text);box-shadow:var(--shadow);border:1.5px solid var(--line)}
.side nav button.on svg{stroke:var(--accent)}
.side nav button:hover:not(.on){color:var(--text);background:rgba(255,255,255,.5)}
.side nav svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.deskmain h2{font-size:27px;margin-bottom:3px}
.deskmain .crumb{color:var(--dim);font-size:14px;margin-bottom:24px;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:22px}
.kpi{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:17px;box-shadow:var(--shadow);border-top:4px solid var(--accent);animation:rise .4s both}
.kpi:nth-child(1){border-top-color:var(--green)} .kpi:nth-child(2){border-top-color:var(--cyan)}
.kpi:nth-child(3){border-top-color:var(--sun)} .kpi:nth-child(4){border-top-color:var(--violet)}
.kpi:nth-child(2){animation-delay:.05s} .kpi:nth-child(3){animation-delay:.1s} .kpi:nth-child(4){animation-delay:.15s}
.kpi .k{font-size:13px;color:var(--dim);font-weight:700} .kpi .v{font-family:var(--num);font-size:28px;margin-top:6px;font-weight:700} .kpi .v small{font-size:15px;color:var(--dim)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.cols-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);font-weight:800;padding:9px 10px;border-bottom:2px solid var(--line)}
td{padding:12px 10px;border-bottom:1px solid var(--line);font-size:14px;font-weight:600}
tr:last-child td{border-bottom:none}
.bal{display:flex;gap:18px;align-items:flex-end;height:155px;padding-top:10px}
.bal .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:9px;height:100%;justify-content:flex-end}
.bal .bar{width:100%;max-width:56px;border-radius:14px 14px 7px 7px;display:flex;align-items:flex-start;justify-content:center;padding-top:7px;transition:height .6s cubic-bezier(.2,.8,.2,1);box-shadow:inset 0 -6px 12px rgba(0,0,0,.06)}
.bal .bar .v{font-family:var(--num);font-size:13px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.18)}
.bal .nm{font-size:13px;color:var(--dim);font-weight:700}
.task-line{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.task-line:last-child{border:none}
.tic{width:42px;height:42px;border-radius:13px;background:var(--card2);display:grid;place-items:center;font-size:19px;flex:none;border:1.5px solid var(--line)}
.chip{font-size:11px;padding:4px 10px;border-radius:9px;background:var(--card2);border:1.5px solid var(--line);color:var(--dim);font-weight:700}

/* =========================================================
   MÓVIL (hijo)
   ========================================================= */
.mob{display:none}
.mob .phone{max-width:480px;margin:0 auto;padding:58px 16px 100px;position:relative;min-height:100vh}
.mob .head{display:flex;align-items:center;gap:13px;margin-bottom:18px}
.mob .head .avatar{width:48px;height:48px;font-size:20px;box-shadow:var(--shadow)}
.mob .head h1{font-size:20px} .mob .head .sub{font-size:12px;color:var(--dim);margin-top:2px;font-weight:700}
.mob .icon-btn{margin-left:auto;width:44px;height:44px;border-radius:14px;background:#fff;border:1.5px solid var(--line);display:grid;place-items:center;box-shadow:var(--shadow)}
.hero{background:linear-gradient(150deg,#fff,#fff0df 60%,#ffe7ec);border:1.5px solid #ffe1bd;border-radius:24px;padding:21px;margin-bottom:16px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero::after{content:"";position:absolute;right:-26px;top:-26px;width:130px;height:130px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,194,75,.45),transparent)}
.hero::before{content:"☀️";position:absolute;right:16px;top:14px;font-size:26px;opacity:.85}
.hero .label{font-size:12px;color:var(--dim);font-weight:700} .hero .big{font-family:var(--num);font-size:44px;font-weight:700;margin-top:6px;line-height:1;color:var(--accent)}
.hero .big small{font-size:19px;color:var(--dim)}
.ring{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;flex:none;background:conic-gradient(var(--accent) calc(var(--pct)*1%), #f1e4d0 0);box-shadow:0 4px 10px rgba(255,122,89,.22)}
.ring .inner{width:52px;height:52px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;font-family:var(--num);color:var(--text)}
.task{display:flex;align-items:center;gap:13px;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:14px;margin-bottom:11px;box-shadow:var(--shadow)}
.task.approved{opacity:.6} .task .tname{font-weight:800} .task .tsub{font-size:12px;color:var(--dim);margin-top:5px}
.mcard{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:15px;margin-bottom:12px;box-shadow:var(--shadow)}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;text-align:center}
.badge{aspect-ratio:1;border-radius:17px;background:linear-gradient(155deg,#fff,#fdf1e0);border:1.5px solid var(--line);display:grid;place-items:center;font-size:26px;box-shadow:var(--shadow);animation:pop .4s both}
.badge:nth-child(2){animation-delay:.04s}.badge:nth-child(3){animation-delay:.08s}.badge:nth-child(4){animation-delay:.12s}
.badge:nth-child(5){animation-delay:.16s}.badge:nth-child(6){animation-delay:.2s}.badge:nth-child(7){animation-delay:.24s}.badge:nth-child(8){animation-delay:.28s}
.badge.locked{opacity:.4;filter:grayscale(.7);box-shadow:none} .badge .l{font-size:9px;color:var(--dim);margin-top:3px;font-weight:700}
.day{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.day:last-child{border:none} .day .dn{width:42px;font-size:12px;color:var(--accent);font-weight:800;text-transform:uppercase}
.seg{display:flex;background:var(--bg2);border:1.5px solid var(--line);border-radius:13px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px;border-radius:10px;font-size:13px;color:var(--dim);font-weight:800}
.seg button.on{background:var(--accent);color:#fff;box-shadow:0 3px 8px rgba(255,122,89,.3)}
.nav{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-top:1.5px solid var(--line);display:flex;padding:9px 6px calc(9px + env(safe-area-inset-bottom));z-index:20;box-shadow:0 -6px 20px rgba(180,120,70,.08)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;color:var(--faint);font-size:10px;font-weight:800;transition:.15s}
.nav button.on{color:var(--accent)} .nav button.on svg{stroke:var(--accent)} .nav svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* Sheet móvil */
.sheet-bg{position:fixed;inset:0;background:rgba(67,53,42,.4);z-index:30;display:none} .sheet-bg.open{display:block;animation:rise .2s}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:var(--card);border-radius:26px 26px 0 0;border:1.5px solid var(--line);padding:22px 18px calc(24px + env(safe-area-inset-bottom));z-index:31;transform:translateY(100%);transition:.32s cubic-bezier(.2,.8,.2,1);max-height:85vh;overflow:auto;box-shadow:var(--shadow-lg)}
.sheet.open{transform:none} .sheet .grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 18px}
.sheet h3{font-size:18px}

/* Modal escritorio */
.modal-bg{position:fixed;inset:0;background:rgba(67,53,42,.45);z-index:40;display:none;place-items:center;padding:20px} .modal-bg.open{display:grid;animation:rise .2s}
.modal{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:26px;width:min(440px,92vw);max-height:88vh;overflow:auto;box-shadow:var(--shadow-lg)}
.modal h3{font-size:20px}

@media(min-width:861px){ .desk{display:block} }
@media(max-width:860px){ .mob{display:block} }

/* =========================================================
   PANTALLAS DE AUTENTICACIÓN (login / register / onboarding)
   ========================================================= */
#auth{display:none}
.auth-shell{min-height:100vh;display:grid;place-items:center;padding:28px 18px}
.auth-card{max-width:420px;width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:28px;box-shadow:var(--shadow)}
.auth-brand{font-family:var(--num);font-weight:700;font-size:22px;margin-bottom:14px;color:var(--accent)}
.auth-card h2{font-size:22px;margin:0 0 4px}
.auth-err{display:none;background:#fde0e0;color:var(--red);border:1.5px solid #f7c4c4;border-radius:12px;padding:10px 12px;font-size:13px;font-weight:700;margin-bottom:12px}
.auth-pick{display:flex;align-items:center;gap:14px;border:1.5px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;cursor:pointer;transition:.15s;background:#fff}
.auth-pick:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.auth-pick-ico{width:46px;height:46px;border-radius:14px;background:#ffe2c8;color:var(--accent);display:grid;place-items:center;font-size:22px;flex:none}
</style>
</head>
<body>
<div id="auth"></div>
<div class="modebar" id="modebar"></div>
<div class="desk" id="desk"></div>
<div class="mob" id="mob"></div>
<div class="sheet-bg" id="sheetBg" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"></div>
<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div>
<script>
// =========================================================================
//  HELPER FETCH CON CREDENCIALES (JWT cookie httpOnly)
// =========================================================================
async function api(url, opts){
  const o = Object.assign({ credentials: "include" }, opts||{});
  if (o.body && typeof o.body !== "string") {
    o.body = JSON.stringify(o.body);
    o.headers = Object.assign({ "Content-Type": "application/json" }, o.headers||{});
  }
  const r = await fetch(url, o);
  let data = null;
  try { data = await r.json(); } catch(e) {}
  if (!r.ok) {
    const err = new Error((data && data.error) || ("http_"+r.status));
    err.status = r.status; err.payload = data;
    throw err;
  }
  return data;
}
// =========================================================================
//  ESTADO Y PERSISTENCIA
// =========================================================================
let _saveTimer=null, _lastSent=0;
const Store = {
  read(){ return null; },
  write(s){
    clearTimeout(_saveTimer);
    _saveTimer=setTimeout(()=>{
      _lastSent=Date.now();
      api("/api/state",{method:"PUT",body:s}).catch(()=>{ showConn(false); });
    },250);
  },
};
function showConn(ok){
  const el=document.getElementById("connDot"); if(!el)return;
  el.style.background = ok? "var(--green)" : "var(--red)";
  el.title = ok? "Conectado" : "Sin conexión con el servidor";
}
const uid=p=>p+Math.random().toString(36).slice(2,8);
const esc=s=>String(s).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
const fmt=n=>(Math.round(n*100)/100).toFixed(2);
const LOAD={normal:1,reducida:.6,minima:.3};
const LOAD_LABEL={normal:"Normal",reducida:"Reducida",minima:"Mínima"};
const DAYS=["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
const monthKey=(d=new Date())=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
const monthName=k=>{const[y,m]=k.split("-");return ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"][+m-1]+" "+y};
// Semana ISO "YYYY-Www" a partir de la fecha real (las fijas se evalúan por semana).
function weekKey(d=new Date()){
  const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const day=(t.getUTCDay()+6)%7; t.setUTCDate(t.getUTCDate()-day+3);
  const firstThu=new Date(Date.UTC(t.getUTCFullYear(),0,4));
  const wk=1+Math.round(((t-firstThu)/86400000-3+((firstThu.getUTCDay()+6)%7))/7);
  return t.getUTCFullYear()+"-W"+String(wk).padStart(2,"0");
}
const todayIdx=()=>(new Date().getDay()+6)%7; // Lun=0 ... Dom=6
const DAYLBL=["L","M","X","J","V","S","D"];
const isDaily=t=>t.freq==="daily";

function seed(){
  return {
    view:"desk", profile:"parent", deskTab:"home", mobTab:"home",
    currentMonth: monthKey(), currentWeek: weekKey(),
    rate:0.05, fixedPay:8,
    members:[
      {id:"ana",name:"Ana",role:"child",color:"#e0588f",load:"normal"},
      {id:"leo",name:"Leo",role:"child",color:"#2f9fd0",load:"reducida"},
      {id:"mia",name:"Mía",role:"child",color:"#2fae73",load:"normal"},
    ],
    // Tareas FIJAS: mismas para todos. Cada hijo tiene su propia instancia/semana.
    fixedTasks:[
      {id:"f1",name:"Hacer la cama",icon:"🛏️",freq:"daily"},
      {id:"f2",name:"Recoger tu plato",icon:"🍽️",freq:"daily"},
      {id:"f3",name:"Preparar la mochila",icon:"🎒",freq:"daily"},
      {id:"f4",name:"Poner una lavadora",icon:"🧺",freq:"weekly"},
    ],
    // Tareas ADICIONALES: se reparten por peso; dan dinero extra.
    extraTasks:[
      {id:"e1",name:"Limpiar el baño",points:40,icon:"🛁"},
      {id:"e2",name:"Aspirar el salón",points:25,icon:"🧹"},
      {id:"e3",name:"Poner la lavadora",points:20,icon:"🧺"},
      {id:"e4",name:"Sacar la basura",points:10,icon:"🗑️"},
      {id:"e5",name:"Pasear al perro",points:15,icon:"🐕"},
    ],
    // Fijas (seguimiento SEMANAL): fixedState[childId][taskId] = {days:[7 bool]}(diaria) | {status}(semanal)
    fixedState:{}, extras:[], generated:false,
    monthPoints:{ana:0,leo:0,mia:0},
    streak:{ana:4,leo:2,mia:6},
    history:{},

let S = null; // se carga del servidor en bootstrap()
function ensureShape(){
  if(!S) return; // el estado aún no ha llegado del servidor
  // Campos de navegación (la semilla del servidor puede no traerlos)
  if(!S.deskTab) S.deskTab="home";
  if(!S.mobTab) S.mobTab="home";
  if(!S.view) S.view="desk";
  if(!S.profile) S.profile="parent";
  // Añade campos nuevos a estados guardados antes de tener mercado.
  if(!Array.isArray(S.listings)) S.listings=[];
  if(!Array.isArray(S.offers)) S.offers=[];
  if(!Array.isArray(S.marketLog)) S.marketLog=[];
  if(Array.isArray(S.extras)) S.extras.forEach(x=>{ if(x.listed===undefined) x.listed=false; });
  if(Array.isArray(S.fixedTasks)) S.fixedTasks.forEach(t=>{ if(!t.freq) t.freq="daily"; });
  if(!S.fixedState || typeof S.fixedState!=="object") S.fixedState={};
  if(!S.currentWeek) S.currentWeek=weekKey();
  delete S.swaps; delete S.fixedInstances;
}

// ---- Reseteo mensual ligado a la fecha real -----------------------------
function rollover(){
  const cur=monthKey();
  if(S.currentMonth===cur) return;
  S.history=S.history||{};
  S.history[S.currentMonth]={points:{...S.monthPoints}};
  S.currentMonth=cur;
  S.monthPoints=Object.fromEntries(S.members.filter(m=>m.role==="child").map(m=>[m.id,0]));
  S.fixedState={}; S.extras=[]; S.generated=false; S.listings=[]; S.offers=[]; S.marketLog=[];
  save();
}
const save=()=>Store.write(S);
const $=id=>document.getElementById(id);
const children=()=>S.members.filter(m=>m.role==="child");
const member=id=>S.members.find(m=>m.id===id);

function generateMonth(){
  // Fijas: una instancia por hijo (mismas tareas para todos)
  S.currentWeek=weekKey();
  initFixedWeek();
  // Adicionales: repartir por peso según disponibilidad
  const kids=children();
  const sumF=kids.reduce((s,c)=>s+LOAD[c.load],0)||1;
  const total=S.extraTasks.reduce((s,t)=>s+t.points,0);
  const bins=kids.map(c=>({id:c.id,target:(total*LOAD[c.load])/sumF,load:0}));
  const ordered=[...S.extraTasks].sort((a,b)=>b.points-a.points);
  S.extras=[];
  for(const t of ordered){
    bins.sort((a,b)=>(b.target-b.load)-(a.target-a.load));
    bins[0].load+=t.points;
    S.extras.push({id:uid("x"),taskId:t.id,memberId:bins[0].id,status:"pending"});
  }
  S.generated=true; save();
}

const fixedTask=id=>S.fixedTasks.find(t=>t.id===id);
const fixedStateOf=(childId,taskId)=>(S.fixedState[childId]||{})[taskId];
function fixedUnits(t){ return isDaily(t)?7:1; }
function initFixedWeek(){
  S.fixedState={};
  children().forEach(c=>{ S.fixedState[c.id]={};
    S.fixedTasks.forEach(t=>{ S.fixedState[c.id][t.id]= isDaily(t)?{days:[false,false,false,false,false,false,false]}:{status:"pending"}; });
  });
}
// Asegura que fixedState tiene forma correcta (nuevos hijos/tareas/cambios de frecuencia)
function ensureFixedShape(){
  if(!S.fixedState) S.fixedState={};
  children().forEach(c=>{
    if(!S.fixedState[c.id]) S.fixedState[c.id]={};
    S.fixedTasks.forEach(t=>{
      const cur=S.fixedState[c.id][t.id];
      if(!cur) S.fixedState[c.id][t.id]= isDaily(t)?{days:[false,false,false,false,false,false,false]}:{status:"pending"};
      else if(isDaily(t)&&!cur.days) S.fixedState[c.id][t.id]={days:[false,false,false,false,false,false,false]};
      else if(!isDaily(t)&&cur.days) S.fixedState[c.id][t.id]={status:"pending"};
    });
  });
}
// Reinicio semanal automático de las fijas
function ensureWeek(){
  const wk=weekKey();
  if(S.currentWeek!==wk){ S.currentWeek=wk; if(S.generated) initFixedWeek(); save(); }
  else ensureFixedShape();
}
function fixedApprovedUnits(childId){
  let n=0;
  S.fixedTasks.forEach(t=>{ const st=fixedStateOf(childId,t.id); if(!st)return;
    if(isDaily(t)) n+=(st.days||[]).filter(Boolean).length; else n+=(st.status==="approved")?1:0; });
  return n;
}
function fixedTotalUnits(childId){ return S.fixedTasks.reduce((s,t)=>s+fixedUnits(t),0); }
const extraTask=id=>S.extraTasks.find(t=>t.id===id);

function fixedRatio(childId){
  const tot=fixedTotalUnits(childId); if(!tot) return 1;
  return fixedApprovedUnits(childId)/tot;
}
function extraPointsApproved(childId){
  return S.extras.filter(x=>x.memberId===childId&&x.status==="approved")
    .reduce((s,x)=>s+extraTask(x.taskId).points,0);
}
function extraPointsAssigned(childId){
  return S.extras.filter(x=>x.memberId===childId).reduce((s,x)=>s+extraTask(x.taskId).points,0);
}
// Puntos del mes (para nivel) = fijas aprobadas (10pts c/u) + adicionales aprobadas
function monthPoints(childId){
  return Math.max(0, fixedApprovedUnits(childId)*2 + extraPointsApproved(childId) + marketBountyNet(childId));
}
// Neto de PUNTOS por primas del mercado, solo de tareas ya APROBADAS.
// (afecta al nivel/premios; el dinero va por el esfuerzo de la tarea hecha)
function marketBountyNet(childId){
  let net=0;
  S.extras.filter(x=>x.status==="approved"&&x.bounty).forEach(x=>{
    if(x.bounty.to===childId) net+=x.bounty.points;
    if(x.bounty.from===childId) net-=x.bounty.points;
  });
  return net;
}
function money(childId){
  const ratio=fixedRatio(childId);
  const fixedEarned=ratio>=0.75?S.fixedPay:0;
  const canExtra=ratio>=1;
  const extraEarned=canExtra?extraPointsApproved(childId)*S.rate:0;
  return {ratio,fixedEarned,extraEarned,total:Math.max(0,fixedEarned+extraEarned),canExtra};
}
function levelOf(childId){ const p=monthPoints(childId); return {level:Math.floor(p/100)+1,into:p%100,points:p}; }

function setFixedStatus(childId,taskId,st){ const cur=fixedStateOf(childId,taskId); if(cur&&!cur.days){ cur.status=st; save(); render(); } }
function toggleFixedDay(childId,taskId,dayIdx){ const cur=fixedStateOf(childId,taskId); if(cur&&cur.days){ cur.days[dayIdx]=!cur.days[dayIdx]; save(); render(); } }
function setFixedFreq(taskId,freq){ const t=fixedTask(taskId); if(t){ t.freq=freq; ensureFixedShape(); save(); render(); } }
function setExtraStatus(id,st){ const x=S.extras.find(e=>e.id===id); if(x){x.status=st;save();render()} }

function listingOf(assignmentId){ return S.listings.find(l=>l.assignmentId===assignmentId && l.status==="open"); }
function offersForListing(listingId){ return S.offers.filter(o=>o.listingId===listingId && o.status==="pending"); }

// Publicar una tarea adicional propia en el mercado.
function publishListing(assignmentId){
  const pts = Math.max(0, parseInt(($("plPoints")||{}).value,10) || 0);
  const trade = ($("plTrade")||{}).checked;
  const note = (($("plNote")||{}).value || "").trim();
  if(pts<=0 && !trade){ alert("Ofrece puntos o permite trueque (o ambos)."); return; }
  const x=S.extras.find(e=>e.id===assignmentId);
  if(!x || x.status!=="pending" || x.listed) return;
  S.listings.push({id:uid("l"), sellerId:x.memberId, assignmentId, taskId:x.taskId,
    pointsOffered:pts, acceptsTrade:!!trade, note, status:"open", createdAt:Date.now()});
  x.listed=true; save(); closeSheet(); render();
}
function cancelListing(listingId){
  const l=S.listings.find(x=>x.id===listingId); if(!l||l.status!=="open")return;
  l.status="cancelled";
  S.offers.filter(o=>o.listingId===listingId&&o.status==="pending").forEach(o=>o.status="rejected");
  const x=S.extras.find(e=>e.id===l.assignmentId); if(x)x.listed=false;
  save(); render();
}
// "Me la quedo": cierre directo por los puntos ofrecidos.
function takeListing(listingId, bidderId){
  const l=S.listings.find(x=>x.id===listingId); if(!l||l.status!=="open"||bidderId===l.sellerId)return;
  const x=S.extras.find(e=>e.id===l.assignmentId); if(!x||x.status!=="pending")return;
  x.memberId=bidderId; x.listed=false;
  if(l.pointsOffered>0) x.bounty={points:l.pointsOffered, from:l.sellerId, to:bidderId};
  l.status="closed";
  S.offers.filter(o=>o.listingId===listingId&&o.status==="pending").forEach(o=>o.status="rejected");
  S.marketLog.push({kind:"take", taskId:l.taskId, from:l.sellerId, to:bidderId, points:l.pointsOffered, at:Date.now()});
  save(); closeSheet(); render();
}
// Ofrecer un trueque: una de mis tareas a cambio (+ puntos opcionales que pido).
function submitTradeOffer(listingId, bidderId){
  const offeredId = ($("toTask")||{}).value;
  const pts = Math.max(0, parseInt(($("toPoints")||{}).value,10) || 0);
  const l=S.listings.find(x=>x.id===listingId); if(!l||l.status!=="open"||!l.acceptsTrade)return;
  const off=S.extras.find(e=>e.id===offeredId);
  if(!off || off.memberId!==bidderId || off.status!=="pending" || off.listed){ alert("Elige una tarea válida tuya."); return; }
  S.offers.push({id:uid("o"), listingId, bidderId, offeredAssignmentId:offeredId, offeredTaskId:off.taskId,
    pointsAsked:pts, status:"pending", createdAt:Date.now()});
  save(); closeSheet(); render();
}
function rejectOffer(offerId){ const o=S.offers.find(x=>x.id===offerId); if(o&&o.status==="pending"){o.status="rejected";save();render()} }
// El vendedor acepta un trueque: se intercambian las tareas (+ compensación en puntos).
function acceptOffer(offerId){
  const o=S.offers.find(x=>x.id===offerId); if(!o||o.status!=="pending")return;
  const l=S.listings.find(x=>x.id===o.listingId); if(!l||l.status!=="open")return;
  const sellerTask=S.extras.find(e=>e.id===l.assignmentId);
  const bidderTask=S.extras.find(e=>e.id===o.offeredAssignmentId);
  if(!sellerTask||!bidderTask||sellerTask.status!=="pending"||bidderTask.status!=="pending"){ alert("Alguna tarea ya no está disponible."); o.status="rejected"; save(); render(); return; }
  sellerTask.memberId=o.bidderId; sellerTask.listed=false;
  bidderTask.memberId=l.sellerId;
  if(o.pointsAsked>0) sellerTask.bounty={points:o.pointsAsked, from:l.sellerId, to:o.bidderId};
  l.status="closed";
  S.offers.filter(x=>x.listingId===l.id&&x.status==="pending").forEach(x=>x.status="rejected");
  S.marketLog.push({kind:"trade", taskId:l.taskId, giveTaskId:o.offeredTaskId, from:l.sellerId, to:o.bidderId, points:o.pointsAsked, at:Date.now()});
  save(); render();
}

function dValidate(){
  const rows=[];
  children().forEach(k=>{
    S.fixedTasks.filter(t=>!isDaily(t)).forEach(t=>{ const st=fixedStateOf(k.id,t.id);
      if(st && (st.status==="submitted"||st.status==="pending")) rows.push({kind:"fixed",childId:k.id,taskId:t.id,status:st.status}); });
  });
  S.extras.forEach(x=>{ if(x.status==="submitted"||x.status==="pending") rows.push({kind:"extra",id:x.id,childId:x.memberId,taskId:x.taskId,status:x.status}); });
  const note=`<p class="dim" style="font-size:13px;margin-bottom:16px">Las tareas <b>diarias</b> (hacer la cama, etc.) las marcan los hijos día a día y no necesitan tu validación. Aquí solo aparecen las <b>semanales</b> y las <b>adicionales</b>.</p>`;
  if(!rows.length) return note+`<div class="empty">Nada pendiente de validar.</div>`;
  return note+`<div class="card"><table><thead><tr><th>Tarea</th><th>Hijo/a</th><th>Tipo</th><th>Estado</th><th></th></tr></thead><tbody>
    ${rows.map(r=>{const t=r.kind==="fixed"?fixedTask(r.taskId):extraTask(r.taskId);
      const act=r.status==="submitted"
        ? (r.kind==="fixed"
            ? `<button class="btn ok sm" onclick="setFixedStatus('${r.childId}','${r.taskId}','approved')">Aprobar</button> <button class="btn sm" onclick="setFixedStatus('${r.childId}','${r.taskId}','pending')">Rechazar</button>`
            : `<button class="btn ok sm" onclick="setExtraStatus('${r.id}','approved')">Aprobar</button> <button class="btn sm" onclick="setExtraStatus('${r.id}','pending')">Rechazar</button>`)
        : (r.kind==="fixed"
            ? `<button class="btn sm" onclick="setFixedStatus('${r.childId}','${r.taskId}','late')">Marcar vencida</button>`
            : `<button class="btn sm" onclick="setExtraStatus('${r.id}','late')">Marcar vencida</button>`);
      return `<tr><td>${t.icon} ${esc(t.name)}</td><td>${member(r.childId).name}</td><td><span class="chip ${r.kind==="fixed"?"p-fixed":"p-extra"}">${r.kind==="fixed"?"semanal":"extra "+t.points}</span></td>
        <td>${r.status==="submitted"?'<span class="pill p-wait">por validar</span>':'<span class="pill p-pending">sin empezar</span>'}</td><td style="text-align:right">${act}</td></tr>`}).join("")}
  </tbody></table></div>`;
}

// Descarga una copia del estado actual desde el servidor.
function downloadBackup(){
  const a=document.createElement("a");
  a.href="/api/backup"; a.download="";
  document.body.appendChild(a); a.click(); a.remove();
}
// Restaura el estado desde un archivo de copia elegido por el usuario.
function restoreBackup(input){
  const file=input.files && input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=async()=>{
    let data;
    try{ data=JSON.parse(reader.result); }catch(e){ alert("El archivo no es una copia válida."); return; }
    if(!data || !Array.isArray(data.members)){ alert("El archivo no parece una copia de esta app."); return; }
    if(!confirm("Esto reemplazará TODOS los datos actuales por los de la copia. ¿Continuar?")){ input.value=""; return; }
    try{
      await api("/api/restore",{method:"POST",body:data});
      S=data; ensureShape(); render();
      alert("Copia restaurada correctamente.");
    }catch(e){ alert("No se pudo restaurar. Inténtalo de nuevo."); }
    input.value="";
  };
  reader.readAsText(file);
}

// Tarjeta de tarea fija en el móvil: diaria (7 casillas) o semanal (validación)
function fixedCardMob(t,meId){
  const st=fixedStateOf(meId,t.id)||{};
  if(isDaily(t)){
    const days=st.days||[false,false,false,false,false,false,false];
    const ti=todayIdx(); const done=days.filter(Boolean).length;
    return `<div class="mcard"><div class="row" style="margin-bottom:10px">
      <div class="tic" style="width:38px;height:38px;font-size:17px">${t.icon}</div>
      <div style="flex:1"><b>${esc(t.name)}</b><div class="dim" style="font-size:11px">Diaria · ${done}/7 días${done===7?' ✓':''}</div></div></div>
      <div style="display:flex;gap:6px">${days.map((d,i)=>`<button onclick="toggleFixedDay('${meId}','${t.id}',${i})" style="flex:1;aspect-ratio:1;border-radius:11px;border:1.5px solid ${d?'var(--green)':'var(--line)'};background:${d?'var(--green)':'#fff'};color:${d?'#fff':'var(--dim)'};font-weight:800;font-size:12px;font-family:var(--num);${i===ti?'box-shadow:0 0 0 2.5px var(--accent)':''}">${DAYLBL[i]}</button>`).join("")}</div>
    </div>`;
  }
  // Semanal: pasa por validación del padre
  const status=st.status||"pending";
  const lbl={pending:"Toca a ti",submitted:"Esperando visto bueno",approved:"Hecha ✓",late:"Vencida"}[status];
  const cls={pending:"p-pending",submitted:"p-wait",approved:"p-ok",late:"p-late"}[status];
  return `<div class="task ${status==="approved"?"approved":""}"><div class="tic" style="width:40px;height:40px;border-radius:11px;background:var(--card2);display:grid;place-items:center;font-size:18px">${t.icon}</div>
    <div style="flex:1"><div class="tname">${esc(t.name)}</div><div class="tsub"><span class="pill p-fixed" style="margin-right:5px">semanal</span><span class="pill ${cls}">${lbl}</span></div></div>
    <div style="text-align:right">${status==="pending"?`<button class="btn ok sm" onclick="setFixedStatus('${meId}','${t.id}','submitted')">Hecha</button>`:""}</div></div>`;
}
// Fila de tarea fija (no afectada por el mercado)
function taskRowMob(t,status,onMark,kind){
  const lbl={pending:"Toca a ti",submitted:"Esperando visto bueno",approved:"Aprobada ✓",late:"Vencida"}[status];
  const cls={pending:"p-pending",submitted:"p-wait",approved:"p-ok",late:"p-late"}[status];
  const pts=kind==="extra"?`+${t.points}`:"";
  return `<div class="task ${status==="approved"?"approved":""}"><div class="tic" style="width:40px;height:40px;border-radius:11px;background:var(--card2);display:grid;place-items:center;font-size:18px">${t.icon}</div>
    <div style="flex:1"><div class="tname">${esc(t.name)}</div><div class="tsub"><span class="pill ${cls}">${lbl}</span></div></div>
    <div style="text-align:right">${pts?`<div class="pts">${pts}</div>`:""}
    ${status==="pending"?`<button class="btn ok sm" style="margin-top:6px" onclick="${onMark()}">Hecha</button>`:""}</div></div>`;
}

// ============== ARRANQUE: auth → onboarding → app ==============
// Sesión del usuario autenticado (devuelta por /api/auth/me).
let ME = null;

// Lee parámetro de query/hash (tokens de verificación, invitación, reset).
function urlParam(name){
  const h = location.hash || "";
  const q = h.includes("?") ? h.split("?")[1] : (location.search.startsWith("?") ? location.search.slice(1) : "");
  const p = new URLSearchParams(q);
  return p.get(name);
}
function urlPath(){
  const h = location.hash || "";
  const noQ = h.includes("?") ? h.split("?")[0] : h;
  return noQ.replace(/^#\/?/, ""); // "login", "verify", "invite", etc.
}

async function bootstrap(){
  // Rutas públicas (no requieren sesión)
  const path = urlPath();
  if (path === "verify") return Auth.verifyEmailFromUrl();
  if (path === "reset-password") return Auth.resetPasswordFromUrl();
  if (path === "forgot-password") return Auth.show("forgot");

  // ¿Sesión activa?
  try { ME = (await api("/api/auth/me")).user; }
  catch (e) {
    if (e.status === 401) { ME = null; }
    else { showFatal("No se pudo conectar con el servidor."); return; }
  }

  // No autenticado
  if (!ME) {
    // Invitación entrante: enseña preview antes del login
    if (path === "invite") return Auth.showInvitePreview(urlParam("token"));
    if (path === "register") return Auth.show("register");
    return Auth.show("login");
  }

  // Autenticado pero sin email verificado
  if (!ME.emailVerified) return Auth.show("verify-pending");

  // Si llega a aceptar invitación con sesión activa:
  if (path === "invite") return Auth.handleInviteWithSession(urlParam("token"));

  // Onboarding: elegir rol
  if (!ME.role) return Auth.show("pick-role");
  // Padre sin familia: crear
  if (ME.role === "parent" && !ME.familyId) return Auth.show("create-family");
  // Hijo sin familia: esperar invitación
  if (ME.role === "child" && !ME.familyId) return Auth.show("waiting");

  // Todo OK → lanza la app principal
  await launchApp();
}

async function launchApp(){
  try{
    S = await api("/api/state");
    showConn(true);
    ensureShape();
    // Vista deriva del rol en la familia (padre → desk, hijo → mob)
    S.view = (ME.roleInFamily === "parent") ? "desk" : "mob";
    S.profile = (ME.roleInFamily === "parent") ? "parent" : ME.id;
    if (S.view === "mob" && !member(S.profile)) {
      // Por si el server aún no sincronizó members
      const kid = children()[0]; if (kid) S.profile = kid.id;
    }
    document.getElementById("auth").style.display = "none";
    document.getElementById("modebar").style.display = "";
    render();
    startPolling();
  }catch(e){
    showFatal("No se pudo cargar la familia. Recarga la página o vuelve a iniciar sesión.");
  }
}

function showFatal(msg){
  document.getElementById("auth").style.display="block";
  document.getElementById("auth").innerHTML =
    '<div class="auth-shell"><div class="auth-card"><h2>Algo no fue bien</h2>'+
    '<p class="dim">'+esc(msg)+'</p>'+
    '<button class="btn primary w" style="margin-top:14px" onclick="location.reload()">Reintentar</button></div></div>';
}

// Sondeo cada 4 s (solo cuando la app está activa)
let _poll=null;
function startPolling(){
  clearInterval(_poll);
  _poll=setInterval(async()=>{
    if(Date.now()-_lastSent<1500) return;
    try{
      const remote = await api("/api/state");
      showConn(true);
      const localView=S.view, localProfile=S.profile;
      const remoteStr=JSON.stringify(stripRole(remote));
      if(remoteStr!==JSON.stringify(stripRole(S))){
        S=remote; S.view=localView; S.profile=localProfile;
        ensureShape(); render();
      }
    }catch(e){
      if(e.status===401){ clearInterval(_poll); ME=null; Auth.show("login"); return; }
      showConn(false);
    }
  },4000);
}
function stripRole(o){ const c={...o}; delete c.view; delete c.profile; return c; }

      "pick-role": Auth.tplPickRole,
      "create-family": Auth.tplCreateFamily,
      "waiting": Auth.tplWaiting,
    }[screen] || Auth.tplLogin)();
  },
  shell(title, subtitle, body, footer){
    return `<div class="auth-shell">
      <div class="auth-card">
        <div class="auth-brand">🏠 <span>Casa</span></div>
        <h2>${esc(title)}</h2>
        ${subtitle?`<p class="dim" style="font-size:13px;margin:6px 0 16px">${esc(subtitle)}</p>`:""}
        ${body}
        ${footer?`<div class="dim" style="font-size:12px;text-align:center;margin-top:18px">${footer}</div>`:""}
      </div></div>`;
  },
  tplLogin(){
    return Auth.shell("Inicia sesión", "Entra con tu correo y contraseña.", `
      <div id="authErr" class="auth-err"></div>
      <div class="field"><label>Correo</label><input id="auEmail" type="email" autocomplete="username" placeholder="tu@email.com"></div>
      <div class="field"><label>Contraseña</label><input id="auPass" type="password" autocomplete="current-password" placeholder="••••••••"></div>
      <button class="btn primary w" onclick="Auth.doLogin()">Entrar</button>
      <div style="text-align:center;margin-top:10px"><a href="#/forgot-password" onclick="event.preventDefault();Auth.show('forgot')" class="dim" style="font-size:13px">¿Olvidaste tu contraseña?</a></div>
    `, `¿Aún no tienes cuenta? <a href="#/register" onclick="event.preventDefault();Auth.show('register')" style="color:var(--accent);font-weight:700">Crear cuenta</a>`);
  },
  tplRegister(){
    return Auth.shell("Crea tu cuenta", "Email, contraseña y nombre. Te enviaremos un email de confirmación.", `
      <div id="authErr" class="auth-err"></div>
      <div class="field"><label>Nombre visible</label><input id="auName" placeholder="Ej. María" maxlength="40"></div>
      <div class="field"><label>Correo</label><input id="auEmail" type="email" autocomplete="email"></div>
      <div class="field"><label>Contraseña (mín. 8)</label><input id="auPass" type="password" autocomplete="new-password"></div>
      <button class="btn primary w" onclick="Auth.doRegister()">Crear cuenta</button>
    `, `¿Ya tienes cuenta? <a href="#/login" onclick="event.preventDefault();Auth.show('login')" style="color:var(--accent);font-weight:700">Inicia sesión</a>`);
  },
  tplForgot(){
    return Auth.shell("Recuperar contraseña", "Te enviaremos un enlace para restablecerla.", `
      <div id="authErr" class="auth-err"></div>
      <div class="field"><label>Correo</label><input id="auEmail" type="email"></div>
      <button class="btn primary w" onclick="Auth.doForgot()">Enviar enlace</button>
    `, `<a href="#/login" onclick="event.preventDefault();Auth.show('login')" style="color:var(--accent);font-weight:700">Volver a iniciar sesión</a>`);
  },
  tplVerifyPending(){
    return Auth.shell("Confirma tu correo", "Te hemos enviado un email para activar la cuenta. Haz clic en el botón del correo para continuar.", `
      <div id="authErr" class="auth-err"></div>
      <button class="btn w" onclick="Auth.doResendVerify()">Reenviar email</button>
      <button class="btn ghost w" style="margin-top:8px" onclick="Auth.doLogout()">Salir</button>
    `);
  },
  tplPickRole(){
    return Auth.shell("¿Cómo vas a usar Casa?", "Esto decide qué pantallas verás. No se puede cambiar después.", `
      <div id="authErr" class="auth-err"></div>
      <div class="auth-pick" onclick="Auth.doPickRole('parent')">
        <div class="auth-pick-ico">🖥️</div>
        <div><b>Soy padre / madre</b><div class="dim" style="font-size:13px">Crearás una familia, invitarás a tus hijos y verás el panel completo.</div></div>
      </div>
      <div class="auth-pick" onclick="Auth.doPickRole('child')">
        <div class="auth-pick-ico" style="background:#d9eefa;color:var(--cyan)">📱</div>
        <div><b>Soy hijo / hija</b><div class="dim" style="font-size:13px">Solo podrás unirte a una familia cuando un padre te invite por email.</div></div>
      </div>
      <button class="btn ghost w" style="margin-top:14px" onclick="Auth.doLogout()">Cerrar sesión</button>
    `);
  },
  tplCreateFamily(){
    return Auth.shell("Crea tu familia", "Pon un nombre. Podrás cambiarlo más adelante.", `
      <div id="authErr" class="auth-err"></div>
      <div class="field"><label>Nombre de la familia</label><input id="auFamName" placeholder="Ej. Familia García" maxlength="60"></div>
      <button class="btn primary w" onclick="Auth.doCreateFamily()">Crear familia</button>
      <button class="btn ghost w" style="margin-top:8px" onclick="Auth.doLogout()">Cerrar sesión</button>
    `);
  },
  tplWaiting(){
    return Auth.shell("Esperando invitación", "Pídele a tu padre o madre que te invite desde su panel introduciendo tu email.", `
      <div class="auth-info" style="background:#eef9f1;border:1.5px solid #bfead4;border-radius:14px;padding:14px;font-size:13px;color:var(--green);margin-bottom:14px">
        Tu email: <b>${ME?esc(ME.email):""}</b>
      </div>
      <button class="btn w" onclick="bootstrap()">Comprobar de nuevo</button>
      <button class="btn ghost w" style="margin-top:8px" onclick="Auth.doLogout()">Cerrar sesión</button>
    `);
  },
  // -------- Acciones --------
  err(msg){ const e=document.getElementById("authErr"); if(e){ e.textContent=msg; e.style.display="block"; } },
  errKey(key){
    const M={
      "email_invalido":"El correo no es válido.",
      "password_corta_min_8":"La contraseña debe tener al menos 8 caracteres.",
      "password_requerida":"Escribe la contraseña.",
      "nombre_requerido":"Pon un nombre visible.",
      "email_ya_registrado":"Ya existe una cuenta con ese correo.",
      "credenciales_invalidas":"Correo o contraseña incorrectos.",
      "email_no_verificado":"Confirma tu correo antes de entrar (revisa tu bandeja).",
      "token_invalido":"El enlace no es válido.",
      "token_expirado":"El enlace ha caducado.",
      "token_ya_usado":"El enlace ya se usó.",
      "demasiados_intentos":"Demasiados intentos. Espera unos minutos.",
      "demasiados_registros":"Demasiados registros. Espera un momento.",
      "demasiadas_solicitudes":"Demasiadas solicitudes. Espera un momento.",
      "ya_en_familia":"Ya perteneces a una familia.",
      "rol_invalido":"Rol no válido.",
      "rol_ya_fijado":"El rol ya está fijado y no se puede cambiar.",
      "nombre_familia_invalido":"El nombre de la familia es demasiado corto.",
      "invitacion_revocada":"Esta invitación fue revocada.",
      "invitacion_ya_aceptada":"Esta invitación ya fue aceptada.",
      "email_no_coincide":"Esta invitación es para otro correo.",
    };
    return M[key] || ("Error: "+key);
  },
  async doLogin(){
    const email=(document.getElementById("auEmail")||{}).value;
    const password=(document.getElementById("auPass")||{}).value;
    try { await api("/api/auth/login",{method:"POST",body:{email,password}}); bootstrap(); }
    catch(e){ Auth.err(Auth.errKey(e.message)); }
  },
  async doRegister(){
    const email=(document.getElementById("auEmail")||{}).value;
    const password=(document.getElementById("auPass")||{}).value;
    const displayName=(document.getElementById("auName")||{}).value;
    try {
      const r=await api("/api/auth/register",{method:"POST",body:{email,password,displayName}});
      if(r.emailDev){
        alert("Cuenta creada ✓\n\nEl servidor no tiene email configurado: el enlace de verificación se ha impreso en la CONSOLA del servidor (terminal donde ejecutas npm start). Cópialo y pégalo en el navegador.");
      } else if(!r.emailSent){
        alert("Cuenta creada ✓\n\nNo se pudo enviar el email de verificación. Revisa la consola del servidor para ver el enlace. Comprueba que RESEND_API_KEY y EMAIL_FROM están bien configurados en .env");
      } else {
        alert("Cuenta creada ✓ Te hemos enviado un email de confirmación. Revisa tu bandeja de entrada (y la carpeta de spam).");
      }
      Auth.show("login");
    } catch(e){ Auth.err(Auth.errKey(e.message)); }
  },
  async doForgot(){
    const email=(document.getElementById("auEmail")||{}).value;
    try {
      await api("/api/auth/forgot-password",{method:"POST",body:{email}});
      alert("Si esa cuenta existe, te hemos enviado un email con instrucciones.");
      Auth.show("login");
    } catch(e){ Auth.err(Auth.errKey(e.message)); }
  },
  async doResendVerify(){
    if(!ME||!ME.email){ Auth.err("Sesión perdida."); return; }
    try {
      await api("/api/auth/resend-verify",{method:"POST",body:{email:ME.email}});
      alert("Email reenviado. Revisa tu bandeja.");
    } catch(e){ Auth.err(Auth.errKey(e.message)); }
  },
  async doLogout(){
    try { await api("/api/auth/logout",{method:"POST"}); }catch(e){}
    ME=null; location.hash="#/login"; Auth.show("login");
  },
  async doPickRole(role){
    try {
      await api("/api/onboarding/role",{method:"POST",body:{role}});
      ME = (await api("/api/auth/me")).user;
      bootstrap();
    } catch(e){ Auth.err(Auth.errKey(e.message)); }
  },
  async doCreateFamily(){
    const name=(document.getElementById("auFamName")||{}).value;
    try {
      await api("/api/onboarding/create-family",{method:"POST",body:{name}});
      ME = (await api("/api/auth/me")).user;
      bootstrap();
    } catch(e){ Auth.err(Auth.errKey(e.message)); }
  },
  async verifyEmailFromUrl(){
    const token = urlParam("token");
    if(!token){ Auth.show("login"); return; }
    document.getElementById("auth").style.display="block";
    document.getElementById("auth").innerHTML = '<div class="auth-shell"><div class="auth-card"><h2>Confirmando tu correo…</h2></div></div>';
    try {
      await api("/api/auth/verify-email",{method:"POST",body:{token}});
      alert("Correo confirmado. Ahora inicia sesión.");
    } catch(e){ alert(Auth.errKey(e.message)); }
    location.hash="#/login"; Auth.show("login");
  },
  async resetPasswordFromUrl(){
    const token = urlParam("token");
    if(!token){ Auth.show("login"); return; }
    document.getElementById("auth").style.display="block";
    document.getElementById("desk").style.display="none";
    document.getElementById("mob").style.display="none";
    document.getElementById("modebar").style.display="none";
    document.getElementById("auth").innerHTML = Auth.shell("Nueva contraseña","Elige una contraseña segura.",`
      <div id="authErr" class="auth-err"></div>
      <div class="field"><label>Contraseña (mín. 8)</label><input id="auPass" type="password" autocomplete="new-password"></div>
      <button class="btn primary w" onclick="Auth.doReset('${esc(token)}')">Guardar</button>`);
  },
  async doReset(token){
    const password=(document.getElementById("auPass")||{}).value;
    try {
      await api("/api/auth/reset-password",{method:"POST",body:{token,password}});
      alert("Contraseña actualizada. Inicia sesión.");
      location.hash="#/login"; Auth.show("login");
    } catch(e){ Auth.err(Auth.errKey(e.message)); }
  },
  async showInvitePreview(token){
    document.getElementById("auth").style.display="block";
    document.getElementById("desk").style.display="none";
    document.getElementById("mob").style.display="none";
    document.getElementById("modebar").style.display="none";
    try {
      const r = await fetch("/api/invitations/preview/"+encodeURIComponent(token));
      const data = await r.json();
      if(!r.ok){
        document.getElementById("auth").innerHTML = Auth.shell("Invitación no válida", data.error || "El enlace no funciona.", '<button class="btn w" onclick="location.hash=\'#/login\';Auth.show(\'login\')">Ir a iniciar sesión</button>');
        return;
      }
      if(data.status!=="pending"){
        document.getElementById("auth").innerHTML = Auth.shell("Invitación no disponible", "Estado: "+data.status, '<button class="btn w" onclick="location.hash=\'#/login\';Auth.show(\'login\')">Ir a iniciar sesión</button>');
        return;
      }
      const roleLbl = data.role==="parent"?"padre/madre":"hijo/a";
      document.getElementById("auth").innerHTML = Auth.shell(
        "Te han invitado a "+data.familyName,
        (data.inviterName||"Un familiar")+" te invita como "+roleLbl+". Inicia sesión o crea tu cuenta con el correo "+data.invitedEmail+".",
        `<button class="btn primary w" onclick="Auth.gotoInviteLogin('${esc(token)}','${esc(data.invitedEmail)}')">Tengo cuenta — iniciar sesión</button>
         <button class="btn w" style="margin-top:8px" onclick="Auth.gotoInviteRegister('${esc(token)}','${esc(data.invitedEmail)}')">Crear cuenta nueva</button>`);
    } catch(e){
      showFatal("No se pudo cargar la invitación.");
    }
  },
  _pendingInviteToken: null,
  gotoInviteLogin(token, email){
    Auth._pendingInviteToken = token;
    Auth.show("login");
    setTimeout(()=>{ const el=document.getElementById("auEmail"); if(el){ el.value=email; } },0);
  },
  gotoInviteRegister(token, email){
    Auth._pendingInviteToken = token;
    Auth.show("register");
    setTimeout(()=>{ const el=document.getElementById("auEmail"); if(el){ el.value=email; el.readOnly=true; } },0);
  },
  async handleInviteWithSession(token){
    document.getElementById("auth").style.display="block";
    document.getElementById("desk").style.display="none";
    document.getElementById("mob").style.display="none";
    document.getElementById("modebar").style.display="none";
    try {
      await api("/api/invitations/accept",{method:"POST",body:{token}});
      alert("Te has unido a la familia.");
      location.hash="";
      ME = (await api("/api/auth/me")).user;
      bootstrap();
    } catch(e){
      document.getElementById("auth").innerHTML = Auth.shell(
        "No se pudo aceptar la invitación", Auth.errKey(e.message),
        '<button class="btn w" onclick="location.hash=\'\';bootstrap()">Continuar</button>');
    }
  },
};

// Si tras un login pendía aceptar una invitación, lo intentamos automáticamente.
async function _consumePendingInvite(){
  if(!Auth._pendingInviteToken || !ME) return false;
  const t = Auth._pendingInviteToken; Auth._pendingInviteToken = null;
  try { await api("/api/invitations/accept",{method:"POST",body:{token:t}}); ME=(await api("/api/auth/me")).user; return true; }
  catch(e){ alert("No se pudo aceptar la invitación: "+Auth.errKey(e.message)); return false; }
}
// Engancha tras login exitoso (parchamos doLogin):
const _origDoLogin = Auth.doLogin;
Auth.doLogin = async function(){
  const email=(document.getElementById("auEmail")||{}).value;
  const password=(document.getElementById("auPass")||{}).value;
  try {
    await api("/api/auth/login",{method:"POST",body:{email,password}});
    ME = (await api("/api/auth/me")).user;
    await _consumePendingInvite();
    bootstrap();
  } catch(e){ Auth.err(Auth.errKey(e.message)); }
};

bootstrap();

</script>
</body>
</html>
